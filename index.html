    ls(args) {
      const flags = args.filter((a) => a.startsWith("-")).join("");
      const targets = args.filter((a) => !a.startsWith("-"));
      const showAll = flags.includes("a");
      const long = flags.includes("l");
      const target = targets[0] || ".";
      const r = resolve(target);
      if (!r.node) { outText("ls: cannot access '" + target + "': No such file or directory"); return; }
      if (r.node.type === "file") { outText(target); return; }
      let names = Object.keys(r.node.children).sort();
      if (showAll) names = [".", "..", ...names];
      if (!showAll) names = names.filter((n) => !n.startsWith("."));
      if (!names.length) return;
      if (long) {
        outText("total " + (names.length * 4));
        for (const n of names) {
          const node = n === "." || n === ".." ? { type: "dir", children: {} } : r.node.children[n];
          const isDir = node.type === "dir";
          const perm = isDir ? "drwxr-xr-x" : (node.exe ? "-rwxr-xr-x" : "-rw-r--r--");
          const size = isDir ? 4096 : (node.content ? node.content.length : 0);
          const date = "Aug 20 09:2" + rint(0, 9);
          out(
            pad(perm, 11) + pad(String(isDir ? 2 : 1), 3) +
            pad(USER, 6) + pad(USER, 6) + pad(String(size), 7) + " " +
            date + " " + colorName(n, node)
          );
        }
      } else {
        out(names.map((n) => {
          const node = n === "." || n === ".." ? { type: "dir" } : r.node.children[n];
          return colorName(n, node);
        }).join("   "));
      }
    },

    tree(args) {
      const start = args[0] || ".";
      const r = resolve(start);
      if (!r.node || r.node.type !== "dir") { outText("tree: " + start + ": Not a directory"); return; }
      out('<span class="dir">' + esc(start) + "</span>");
      let dirs = 0, files = 0;
      function walk(node, prefix) {
        const names = Object.keys(node.children).filter((n) => !n.startsWith(".")).sort();
        names.forEach((n, i) => {
          const child = node.children[n];
          const last = i === names.length - 1;
          out(prefix + (last ? "└── " : "├── ") + colorName(n, child));
          if (child.type === "dir") { dirs++; walk(child, prefix + (last ? "    " : "│   ")); }
          else files++;
        });
      }
      walk(r.node, "");
      out("");
      outText(dirs + " directories, " + files + " files");
    },

    cd(args) {
      const t = args[0] || "~";
      const r = resolve(t);
      if (!r.node) { outText("cd: " + t + ": No such file or directory"); return; }
      if (r.node.type !== "dir") { outText("cd: " + t + ": Not a directory"); return; }
      cwd = r.parts;
    },

    cat(args) {
      if (!args.length) { outText("cat: missing operand"); return; }
      for (const a of args) {
        const r = resolve(a);
        if (!r.node) { outText("cat: " + a + ": No such file or directory"); continue; }
        if (r.node.type === "dir") { outText("cat: " + a + ": Is a directory"); continue; }
        const content = r.node.content || "";
        content.split("\n").forEach((l, i, arr) => {
          if (i === arr.length - 1 && l === "") return;
          outText(l);
        });
      }
    },

    head(args) {
      const file = args.filter((a) => !a.startsWith("-"))[0];
      const r = resolve(file || "");
      if (!r.node || r.node.type !== "file") { outText("head: cannot open '" + file + "'"); return; }
      r.node.content.split("\n").slice(0, 10).forEach((l) => outText(l));
    },

    stat(args) {
      const a = args[0];
      const r = resolve(a || "");
      if (!r.node) { outText("stat: cannot statx '" + a + "': No such file or directory"); return; }
      const isDir = r.node.type === "dir";
      outText("  File: " + a);
      outText("  Size: " + (isDir ? 4096 : (r.node.content || "").length) +
        "        Blocks: 8          IO Block: 4096   " + (isDir ? "directory" : "regular file"));
      outText("Access: (" + (isDir ? "0755/drwxr-xr-x" : "0644/-rw-r--r--") + ")  Uid: ( 1000/" + USER + ")   Gid: ( 1000/" + USER + ")");
    },

    mkdir(args) {
      for (const a of args) {
        if (a.startsWith("-")) continue;
        const parts = pathParts(a);
        const parent = parentOf(parts);
        const name = parts[parts.length - 1];
        if (!parent || parent.type !== "dir") { outText("mkdir: cannot create directory '" + a + "': No such file or directory"); continue; }
        if (parent.children[name]) { outText("mkdir: cannot create directory '" + a + "': File exists"); continue; }
        parent.children[name] = dir({});
      }
    },

    touch(args) {
      for (const a of args) {
        const parts = pathParts(a);
        const parent = parentOf(parts);
        const name = parts[parts.length - 1];
        if (!parent || parent.type !== "dir") { outText("touch: cannot touch '" + a + "': No such file or directory"); continue; }
        if (!parent.children[name]) parent.children[name] = file("");
      }
    },

    rm(args) {
      const recursive = args.some((a) => /^-.*r/.test(a));
      for (const a of args) {
        if (a.startsWith("-")) continue;
        const parts = pathParts(a);
        const parent = parentOf(parts);
        const name = parts[parts.length - 1];
        if (!parent || !parent.children[name]) { outText("rm: cannot remove '" + a + "': No such file or directory"); continue; }
        if (parent.children[name].type === "dir" && !recursive) { outText("rm: cannot remove '" + a + "': Is a directory"); continue; }
        delete parent.children[name];
      }
    },

    cp(args) { moveOrCopy(args, "cp"); },
    mv(args) { moveOrCopy(args, "mv"); },

    find(args) {
      const start = args[0] && !args[0].startsWith("-") ? args[0] : ".";
      const r = resolve(start);
      if (!r.node) { outText("find: '" + start + "': No such file or directory"); return; }
      const base = start === "." ? "." : start;
      function walk(node, path) {
        outText(path);
        if (node.type === "dir")
          for (const n of Object.keys(node.children).sort())
            walk(node.children[n], path + "/" + n);
      }
      walk(r.node, base);
    },

  function moveOrCopy(args, kind) {
    const files = args.filter((a) => !a.startsWith("-"));
    if (files.length < 2) { outText(kind + ": missing destination file operand"); return; }
    const dest = files.pop();
    for (const src of files) {
      const sr = resolve(src);
      if (!sr.node) { outText(kind + ": cannot stat '" + src + "': No such file or directory"); continue; }
      const dparts = pathParts(dest);
      let dparent = parentOf(dparts);
      let dname = dparts[dparts.length - 1];
      const dr = resolve(dest);
      if (dr.node && dr.node.type === "dir") { dparent = dr.node; dname = sr.parts[sr.parts.length - 1]; }
      if (!dparent) { outText(kind + ": cannot create '" + dest + "'"); continue; }
      dparent.children[dname] = JSON.parse(JSON.stringify(sr.node));
      if (kind === "mv") {
        const sp = parentOf(sr.parts);
        delete sp.children[sr.parts[sr.parts.length - 1]];
      }
    }
  }

  // ======================================================================
  //  pacman (async, with progress bars)
  // ======================================================================
  const REPO = {
    "neovim": ["0.10.1-2", "extra", "32.4 MiB", "An hyperextensible Vim-based text editor"],
    "firefox": ["130.0-1", "extra", "228.7 MiB", "Standalone web browser from mozilla.org"],
    "git": ["2.46.0-1", "extra", "28.9 MiB", "the fast distributed version control system"],
    "htop": ["3.3.0-1", "extra", "0.3 MiB", "Interactive process viewer"],
    "cowsay": ["3.8.4-1", "extra", "0.1 MiB", "Configurable talking characters in ASCII art"],
    "hyprland": ["0.42.0-1", "extra", "12.1 MiB", "a highly customizable dynamic tiling Wayland compositor"],
    "python": ["3.12.5-1", "core", "88.3 MiB", "The high-level programming language"],
    "docker": ["1:27.2.0-1", "extra", "134.0 MiB", "Pack, ship and run any application as a lightweight container"],
    "vlc": ["3.0.21-4", "extra", "94.2 MiB", "Multi-platform MPEG, VCD/DVD, and DivX player"],
  };

  async function pacman(args) {
    const op = args.find((a) => a.startsWith("-")) || "";
    const targets = args.filter((a) => !a.startsWith("-"));

    if (op === "-V" || op === "--version") {
      outLines([
        "                       .--.                  Pacman v6.1.0 - libalpm v14.0.0",
        "                      / _.-' .-.  .-.  .-.    Copyright (C) 2006-2024 Pacman Development Team",
        "                      \\  '-. '-'  '-'  '-'    Copyright (C) 2002-2006 Judd Vinet",
        "                       '--'",
        "                                              This program may be freely redistributed under",
        "                                              the terms of the GNU General Public License.",
      ]);
      return;
    }

    if (op.startsWith("-Q")) {
      // list installed
      const installed = [
        ["base", "3-2"], ["linux", KVER.replace("-arch1-1", ".arch1-1")], ["linux-firmware", "20240811.717d4a1e-1"],
        ["systemd", "256.5-1"], ["bash", "5.2.026-2"], ["pacman", "6.1.0-7"], ["coreutils", "9.5-1"],
        ["glibc", "2.40-1"], ["gcc", "14.2.1-1"], ["mesa", "1:24.2.1-1"], ["hyprland", "0.42.0-1"],
        ["foot", "1.18.1-1"], ["fastfetch", "2.21.3-1"], ["neovim", "0.10.1-2"], ["firefox", "130.0-1"],
        ["git", "2.46.0-1"], ["nano", "8.1-1"], ["openssh", "9.8p1-1"], ["networkmanager", "1.48.10-1"],
      ];
      if (op === "-Qi" && targets[0]) {
        const p = targets[0];
        const meta = REPO[p] || ["1.0.0-1", "extra", "1.0 MiB", "A package"];
        outLines([
          "Name            : " + p,
          "Version         : " + meta[0],
          "Description     : " + meta[3],
          "Architecture    : x86_64",
          "URL             : https://archlinux.org/packages/" + meta[1] + "/x86_64/" + p + "/",
          "Licenses        : GPL",
          "Repository      : " + meta[1],
          "Installed Size  : " + meta[2],
          "Install Date    : Sun 20 Aug 2026 08:40:00 AM UTC",
          "Install Reason  : Explicitly installed",
        ]);
        return;
      }
      const extra = Object.keys(INSTALLED).filter((k) => k !== "noctalia-shell").map((k) => [k, INSTALLED[k]]);
      const rows = installed.concat(extra);
      const qf = targets[0];
      (qf ? rows.filter((r) => r[0].includes(qf)) : rows).forEach(([n, v]) => out('<span class="white">' + esc(n) + "</span> " + '<span class="green">' + esc(v) + "</span>"));
      out("");
      outText(rows.length + " packages installed shown of " + packageCount() + " total");
      return;
    }

    if (op.startsWith("-Ss") || op === "-Ss") {
      const q = targets[0] || "";
      const hits = Object.keys(REPO).filter((k) => k.includes(q) || REPO[k][3].toLowerCase().includes(q));
      if (!hits.length) { outText("error: no results found for '" + q + "'"); return; }
      for (const k of hits) {
        const m = REPO[k];
        out('<span class="magenta">' + m[1] + "/</span><span class=\"white b\">" + k + "</span> <span class=\"green\">" + m[0] + "</span>");
        outText("    " + m[3]);
      }
      return;
    }

    if (op.startsWith("-Si") && targets[0]) {
      const p = targets[0], m = REPO[p];
      if (!m) { outText("error: package '" + p + "' was not found"); return; }
      outLines([
        "Repository      : " + m[1],
        "Name            : " + p,
        "Version         : " + m[0],
        "Description     : " + m[3],
        "Architecture    : x86_64",
        "Download Size   : " + m[2],
      ]);
      return;
    }

    // -S / -Syu install & upgrade
    if (op.startsWith("-S")) {
      const sync = op.includes("y");
      const upgrade = op.includes("u");
      inputEnabled = false;
      try {
        if (sync) {
          for (const repo of ["core", "extra", "multilib"]) {
            out('<span class="green b">:: </span><span class="b">Synchronizing package databases...</span>');
            await progress(repo, rint(120, 260) + ".0 KiB", rint(200, 600));
          }
        }
        if (upgrade) {
          out('<span class="green b">:: </span><span class="b">Starting full system upgrade...</span>');
          const pkgs = [["linux", KVER], ["mesa", "1:24.2.2-1"], ["systemd", "256.6-1"], ["firefox", "130.0.1-1"]];
          await installPkgs(pkgs.map((p) => p[0]), "upgrade");
          return;
        }
        if (targets.length) {
          // Noctalia ships in the AUR / from source — route through a real makepkg build
          const nocNames = ["noctalia", "noctalia-shell", "noctalia-shell-git", "noctalia-git"];
          const nocTarget = targets.find((t) => nocNames.includes(t.toLowerCase()));
          if (nocTarget) { inputEnabled = true; await installNoctalia(nocTarget); return; }
          const unknown = targets.filter((t) => !REPO[t]);
          if (unknown.length) {
            outText("error: target not found: " + unknown[0]);
            out('<span class="muted">  (is it an AUR package? try an AUR helper, e.g. `yay -S ' + unknown[0] + "`)</span>");
            inputEnabled = true; return;
          }
          await installPkgs(targets, "install");
          for (const t of targets) if (REPO[t]) INSTALLED[t] = REPO[t][0];
          persist();
          return;
        }
        outText("error: no targets specified (use -h for help)");
      } finally {
        inputEnabled = true;
      }
      return;
    }

    outText("error: no operation specified (use -h for help)");
  }

  function bar(frac, width) {
    const full = Math.round(frac * width);
    return "[" + "#".repeat(full) + "-".repeat(width - full) + "]";
  }

  async function progress(label, size, dur) {
    const line = out("");
    const width = 38;
    const steps = reduceMotion ? 1 : 24;
    for (let i = 0; i <= steps; i++) {
      const frac = i / steps;
      const pct = Math.round(frac * 100);
      line.innerHTML =
        '<span class="white">' + pad(label, 22) + "</span>" + pad(size, 10) +
        ' <span class="pbar">' + bar(frac, width) + "</span> " + pad(pct + "%", 5);
      scrollDown();
      if (!reduceMotion) await sleep(dur / steps);
    }
  }

  async function installPkgs(names, mode) {
    const metas = names.map((n) => [n, REPO[n] || ["1.0.0-1", "extra", rint(1, 40) + "." + rint(0, 9) + " MiB", "A package"]]);
    out("");
    out('<span class="b">Packages (' + metas.length + ")</span>  " + metas.map((m) => m[0] + "-" + m[1][0]).join("  "));
    out("");
    const totalDl = (metas.reduce((s, m) => s + parseFloat(m[1][2]), 0)).toFixed(2);
    outText("Total Download Size:   " + totalDl + " MiB");
    outText("Total Installed Size:  " + (totalDl * 3.4).toFixed(2) + " MiB");
    out("");
    out('<span class="green b">:: </span>Proceed with installation? [Y/n] ');
    if (!reduceMotion) await sleep(360);

  // ---------------------------------------------------------------- persistence

  let persistTimer = null;
  function persist() {

  }
  function loadState() {
    try {

      if (!raw) return false;

  // ------------------------------------------------------------------- helpers
  function absOf(parts) { return "/" + parts.join("/"); }
  function mkdirp(parts) {
    let node = root;
    for (const seg of parts) {
      if (!node.children[seg]) node.children[seg] = dir({});
      node = node.children[seg];
      if (node.type !== "dir") return null;
    }
    return node;
  }
  function writeFileAt(pathStr, content, extra) {
    const parts = pathParts(pathStr);
    const parent = mkdirp(parts.slice(0, -1));
    if (!parent) return false;
    parent.children[parts[parts.length - 1]] = Object.assign({ type: "file", content: content }, extra || {});
    return true;
  }
  function readFileAt(pathStr) {
    const r = resolve(pathStr);
    return r.node && r.node.type === "file" ? r.node.content : null;
  }
  function walkFiles(node, base, acc) {
    for (const name of Object.keys(node.children)) {
      if (name === ".git") continue;
      const child = node.children[name];
      const p = base + "/" + name;
      if (child.type === "dir") walkFiles(child, p, acc);
      else acc[p.replace(/^\/+/, "")] = child.content || "";
    }
    return acc;
  }

  // ----------------------------------------------------------------------- git
  const GITREPOS = {};   // repoRootPathString -> repo object
  const GITCONFIG = { "user.name": "arch", "user.email": "arch@archlinux" };

  function findRepo(parts) {
    for (let i = parts.length; i >= 0; i--) {
      const key = absOf(parts.slice(0, i));
      if (GITREPOS[key]) return { key: key, repo: GITREPOS[key], rootParts: parts.slice(0, i) };
    }
    return null;
  }
  function relTo(rootParts, parts) { return parts.slice(rootParts.length).join("/"); }
  function newRepo(rootParts) {
    const key = absOf(rootParts);
    const repo = { head: "main", branches: { main: null }, commits: {}, index: {}, tracked: {}, seq: 0 };
    GITREPOS[key] = repo;
    const node = nodeAt(rootParts);
    if (node && node.type === "dir" && !node.children[".git"]) node.children[".git"] = dir({ HEAD: file("ref: refs/heads/main\n") });
    return { key: key, repo: repo, rootParts: rootParts };
  }
  function shortId(id) { return id.slice(0, 7); }
  function commitTreeSnapshot(rootParts) {
    const node = nodeAt(rootParts);
    return walkFiles(node, "", {});
  }

  async function gitCmd(args) {
    const sub = args[0];
    if (!sub || sub === "--version") { outText("git version 2.46.0"); return; }

    if (sub === "config") {
      const rest = args.slice(1).filter((a) => !a.startsWith("-"));
      if (rest.length >= 2) { GITCONFIG[rest[0]] = args.slice(args.indexOf(rest[0]) + 1).join(" ").replace(/^["']|["']$/g, ""); persist(); }
      else if (rest.length === 1) { outText(GITCONFIG[rest[0]] || ""); }
      else { for (const k of Object.keys(GITCONFIG)) outText(k + "=" + GITCONFIG[k]); }
      return;
    }

    if (sub === "init") {
      const found = findRepo(cwd);
      newRepo(cwd.slice());
      outText((found ? "Reinitialized existing" : "Initialized empty") + " Git repository in " + absOf(cwd) + "/.git/");
      persist();
      return;
    }

    if (sub === "clone") {
      const url = args.slice(1).find((a) => !a.startsWith("-")) || "";
      if (!url) { outText("fatal: You must specify a repository to clone."); return; }
      let name = (args.slice(1).filter((a) => !a.startsWith("-"))[1]) ||
        url.replace(/\.git$/, "").split("/").filter(Boolean).pop() || "repo";
      await gitClone(url, name);
      return;
    }

    const found = findRepo(cwd);
    if (!found && ["status", "add", "commit", "log", "branch", "checkout", "diff", "rm"].includes(sub)) {
      outText("fatal: not a git repository (or any of the parent directories): .git");
      return;
    }
    const repo = found && found.repo;

    if (sub === "status") {
      out('<span class="b">On branch ' + repo.head + "</span>");
      const worktree = commitTreeSnapshot(found.rootParts);
      const headTree = repo.branches[repo.head] ? repo.commits[repo.branches[repo.head]].tree : {};
      const staged = [], notStaged = [], untracked = [];
      for (const f of Object.keys(worktree)) {
        if (!(f in repo.index) && !(f in headTree)) untracked.push(f);
        else if ((f in repo.index) && repo.index[f] !== (headTree[f] || null)) { if (worktree[f] !== repo.index[f]) notStaged.push(f); else staged.push(f); }
        else if ((f in headTree) && worktree[f] !== headTree[f] && !(f in repo.index)) notStaged.push(f);
        else if ((f in repo.index) && worktree[f] !== repo.index[f]) notStaged.push(f);
      }
      if (repo.branches[repo.head] == null && !staged.length && !untracked.length && !notStaged.length)
        out("\nNo commits yet\n");
      if (staged.length) {
        out('\nChanges to be committed:');
        staged.forEach((f) => out('  <span class="green">' + (f in headTree ? "modified:   " : "new file:   ") + esc(f) + "</span>"));
      }
      if (notStaged.length) {
        out('\nChanges not staged for commit:');
        notStaged.forEach((f) => out('  <span class="fail">modified:   ' + esc(f) + "</span>"));
      }
      if (untracked.length) {
        out('\nUntracked files:');
        out('  <span class="muted">(use "git add &lt;file&gt;..." to include in what will be committed)</span>');
        untracked.forEach((f) => out('  <span class="fail">' + esc(f) + "</span>"));
      }
      if (!staged.length && !notStaged.length && !untracked.length && repo.branches[repo.head] != null)
        out("nothing to commit, working tree clean");
      return;
    }

    if (sub === "add") {
      const worktree = commitTreeSnapshot(found.rootParts);
      const targets = args.slice(1).filter((a) => !a.startsWith("-"));
      const all = targets.includes(".") || targets.includes("-A") || args.includes("-A");
      for (const f of Object.keys(worktree)) {
        if (all || targets.some((t) => f === t || f.startsWith(t.replace(/\/$/, "") + "/")))
          repo.index[f] = worktree[f];
      }
      persist();
      return;
    }

    if (sub === "commit") {
      const mi = args.indexOf("-m");
      const msg = mi >= 0 ? (args[mi + 1] || "") : "";
      if (args.includes("-a") || args.includes("-am")) {
        const worktree = commitTreeSnapshot(found.rootParts);
        const headTree = repo.branches[repo.head] ? repo.commits[repo.branches[repo.head]].tree : {};
        for (const f of Object.keys(worktree)) if (f in headTree) repo.index[f] = worktree[f];
      }
      if (!msg) { outText("Aborting commit due to empty commit message."); return; }
      const headTree = repo.branches[repo.head] ? repo.commits[repo.branches[repo.head]].tree : {};
      const tree = Object.assign({}, headTree, repo.index);
      const changed = Object.keys(tree).filter((f) => tree[f] !== headTree[f]).length;
      if (!changed && repo.branches[repo.head] != null) { outText("nothing to commit, working tree clean"); return; }
      const id = (repo.seq++ + "-" + Date.now() + "-" + Math.random()).replace(/\D/g, "").padEnd(40, "0").slice(0, 40);
      repo.commits[id] = { tree: tree, parent: repo.branches[repo.head], msg: msg, author: GITCONFIG["user.name"], date: new Date().toString() };
      repo.branches[repo.head] = id;
      const files = Object.keys(tree).length;
      out("[" + repo.head + " " + shortId(id) + (repo.commits[id].parent ? "" : " (root-commit)") + "] " + esc(msg));
      out(" " + changed + " file" + (changed !== 1 ? "s" : "") + " changed, " + files + " total");
      persist();
      return;
    }

    if (sub === "log") {
      let id = repo.branches[repo.head];
      if (!id) { outText("fatal: your current branch '" + repo.head + "' does not have any commits yet"); return; }
      const oneline = args.includes("--oneline");
      let count = 0;
      while (id && count < 50) {
        const c = repo.commits[id];
        if (oneline) out('<span class="warn">' + shortId(id) + "</span> " + esc(c.msg));
        else {
          out('<span class="warn">commit ' + id + "</span>");
          out("Author: " + esc(c.author) + " <" + GITCONFIG["user.email"] + ">");
          out("Date:   " + c.date);
          out("\n    " + esc(c.msg) + "\n");
        }
        id = c.parent; count++;
      }
      return;
    }

    if (sub === "branch") {
      const name = args.slice(1).find((a) => !a.startsWith("-"));
      if (!name) { for (const b of Object.keys(repo.branches)) out((b === repo.head ? '<span class="green">* ' + b + "</span>" : "  " + b)); return; }
      if (!repo.branches[name]) repo.branches[name] = repo.branches[repo.head];
      persist();
      return;
    }

    if (sub === "checkout") {
      const b = args[args.length - 1];
      if (args.includes("-b")) { repo.branches[b] = repo.branches[repo.head]; repo.head = b; out("Switched to a new branch '" + esc(b) + "'"); }
      else if (repo.branches[b] !== undefined) { repo.head = b; out("Switched to branch '" + esc(b) + "'"); }
      else outText("error: pathspec '" + b + "' did not match any file(s) known to git");
      const g = nodeAt(found.rootParts).children[".git"];
      if (g) g.children.HEAD = file("ref: refs/heads/" + repo.head + "\n");
      persist();
      return;
    }

    if (sub === "diff") { outText("(diff rendering is summarized here — use `git status` for changed files)"); return; }
    if (sub === "remote") { if (args[1] === "-v") { const r = repo.origin || ""; if (r) { outText("origin\t" + r + " (fetch)"); outText("origin\t" + r + " (push)"); } } return; }
    if (sub === "pull" || sub === "fetch" || sub === "push") { outText(sub === "push" ? "Everything up-to-date" : "Already up to date."); return; }

    outText("git: '" + sub + "' is not a git command. See 'git --help'.");
  }

  async function gitClone(url, name) {
    inputEnabled = false;
    try {
      out("Cloning into '" + esc(name) + "'...");
      const isNoc = /noctalia/i.test(url);
      out("remote: Enumerating objects: " + (isNoc ? 4821 : rint(40, 400)) + ", done.");
      out("remote: Counting objects: 100% (" + (isNoc ? 4821 : rint(40, 400)) + "/" + (isNoc ? 4821 : rint(40, 400)) + "), done.");
      out("remote: Compressing objects: 100%, done.");
      await progress("Receiving objects", (isNoc ? "12.4 MiB" : rint(1, 900) + " KiB"), rint(500, 1100));
      out("Resolving deltas: 100% (" + rint(500, 3000) + "/" + rint(500, 3000) + "), done.");
      // materialize
      const dest = cwd.concat(name);
      mkdirp(dest);
      if (isNoc) materializeNoctaliaRepo(dest);
      else {
        writeFileAt(absOf(dest) + "/README.md", "# " + name + "\n\nCloned from " + url + "\n");
        writeFileAt(absOf(dest) + "/.gitignore", "node_modules/\n*.log\n");
      }
      const rp = newRepo(dest);
      rp.repo.origin = url;
      // seed an initial commit representing the cloned history
      const tree = commitTreeSnapshot(dest);
      const id = (Date.now() + "" + rint(1e5, 9e5)).padEnd(40, "0").slice(0, 40);
      rp.repo.commits[id] = { tree: tree, parent: null, msg: "Initial commit", author: "noctalia-dev", date: new Date().toString() };
      rp.repo.branches.main = id;
      persist();
    } finally { inputEnabled = true; }
  }

    writeFileAt(b + "/src/theme/builtin_palettes.cpp", bundled("noc-palette"));

      stderr: { write: (s) => { String(s).replace(/\n$/, "").split("\n").forEach((x) => outText(x)); } } };

  // --- diagnostics: emulate the diagnostics a real gcc frontend prints -------
  function emitCDiag(file, d, level, srcLines) {

    out('<span class="b">' + esc(file) + ":" + d.line + ":" + d.col + ":</span> " +
        '<span class="' + color + ' b">' + level + ":</span> " + esc(d.msg) +
        (d.flag ? ' <span class="muted">[' + esc(d.flag) + "]</span>" : ""));
    const ln = srcLines[d.line - 1];
    if (ln != null) {
      const gutter = String(d.line).padStart(5, " ");
      out('<span class="cyan">' + gutter + " |</span> " + esc(ln));
      out('<span class="cyan">' + " ".repeat(5) + " |</span> " + " ".repeat(Math.max(0, d.col - 1)) + '<span class="fail">^</span>');

      if (q % 2 === 1) errors.push({ line: i + 1, col: firstQ + 1, msg: 'missing terminating " character' });

    sLines.forEach((ln, i) => { for (let k = 0; k < ln.length; k++) { if (ln[k] === "{") depth++; else if (ln[k] === "}") { depth--; if (depth < 0) { errors.push({ line: i + 1, col: k + 1, msg: "expected declaration or statement before ‘}’ token" }); depth = 0; } } } });
    if (depth > 0) errors.push({ line: raw.length, col: (raw[raw.length - 1] || "").length + 1, msg: "expected ‘}’ at end of input" });
    const hasMain = /\bmain\s*\(/.test(stripped);
    // implicit-declaration warnings when the matching header isn't included
    const libByHeader = {
      "stdio.h": ["printf", "scanf", "puts", "putchar", "getchar", "fprintf", "sprintf", "fgets", "fopen", "fclose", "fputs"],
      "stdlib.h": ["malloc", "free", "calloc", "realloc", "atoi", "atof", "rand", "srand", "exit", "abs", "qsort"],
      "string.h": ["strlen", "strcmp", "strcpy", "strcat", "strncmp", "memcpy", "memset", "strchr"],
      "math.h": ["sqrt", "pow", "sin", "cos", "tan", "floor", "ceil", "fabs", "log", "exp"],

        if (li >= 0) warnings.push({ line: li + 1, col: sLines[li].search(new RegExp("\\b" + fn)) + 1, msg: "implicit declaration of function ‘" + fn + "’", flag: "-Wimplicit-function-declaration" });

          if (op === "-ne") return +x !== +y;
          if (op === "-lt") return +x < +y;
          if (op === "-le") return +x <= +y;

    async function runBranch(active) {

      while (i < lines.length) {

          if (f === "for") { await doFor(l); continue; }
          if (f === "while") { await doWhile(l); continue; }

        i = startLine;

      }
      // advance past done
      // find the done for this loop from startLine
      i = startLine;
      let depth = 1;
      while (i < lines.length && depth > 0) {
        const f = lines[i].trim().split(/\s+/)[0];
        if (["for", "while", "if"].includes(f)) depth++;
        if (f === "done" || f === "fi") depth--;
        i++;
      }
    }
    async function doWhile(headLine) {
      let cond = headLine.replace(/^while\s+/, "").replace(/;\s*do\s*$/, "");

    }
    await block(null);
    persist();
  }

      "#noctalia .notif .napp{font-size:11px;color:" + onv + ";margin-top:4px;text-transform:uppercase;letter-spacing:.04em;}",

      "#noctalia .lock{position:absolute;inset:0;z-index:95;background:radial-gradient(1200px 800px at 50% 30%," + NOC.secondary + "1a,transparent 60%),linear-gradient(160deg,#0a0a26,#050518);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;visibility:hidden;transition:opacity .4s " + EZ.quad + ",visibility 0s .4s;}",
      "#noctalia .lock.show{opacity:1;visibility:visible;transition:opacity .45s " + EZ.quad + ";}",

      "#noctalia .lock .d{color:" + onv + ";font-size:16px;margin-bottom:12px;}",

      "#noctalia .lock input{margin-top:6px;background:" + NOC.surface + "cc;border:1px solid " + out + ";border-radius:24px;padding:11px 20px;color:" + on + ";font:inherit;text-align:center;outline:none;width:280px;transition:border-color .2s;}",
      "#noctalia .lock input:focus{border-color:" + pri + ";}",

    document.head.appendChild(s);

  const NOC_APPS = [
    ["Firefox", "Web Browser", "🦊", "#ff7139"], ["Files", "File Manager", "📁", "#7c80b4"],
    ["Terminal", "foot — drops back to the TTY", "▊", NOC.primary], ["Visual Studio Code", "Code Editor", "🧩", "#2f9bff"],
    ["Settings", "Noctalia control center", "⚙", NOC.onSurfaceVariant], ["Discord", "Chat", "🎮", "#5865f2"],
    ["Spotify", "Music", "🎵", "#1db954"], ["GIMP", "Image Editor", "🖌", "#5c5543"],
    ["Steam", "Games", "🎯", "#66c0f4"], ["Neovim", "Text Editor", "📝", NOC.tertiary],
  ];

  const NOC_PANELS = ["noc-launcher", "noc-cc", "noc-session", "noc-cal"];
  const PANEL_BTN = { "noc-launcher": "launcher", "noc-cc": "cc", "noc-session": "session", "noc-cal": "clock" };

  function buildNoctalia() {
    if (nocEl) return;
    nocStyle();
    const el = document.createElement("div");
    el.id = "noctalia";
    el.innerHTML =
      '<div class="wall"></div><div class="grain"></div>' +
      '<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>' +
      '<div class="bar">' +
        '<div class="sec start">' +
          '<button class="w accent" data-act="launcher" title="Launcher (Super)">' + ic("grid") + "</button>" +
          '<button class="w" data-act="wallpaper" title="Wallpaper">' + ic("photo") + "</button>" +
          '<div class="ws" id="noc-ws"></div>' +
        "</div>" +
        '<div class="sec center"><button class="w" data-act="clock" title="Calendar"><span class="clock" id="noc-clock"></span></button></div>' +
        '<div class="sec end">' +
          '<button class="w" data-act="notif" title="Notifications">' + ic("bell") + "</button>" +
          '<button class="w" data-act="clip" title="Clipboard">' + ic("clip") + "</button>" +
          '<button class="w" data-act="net" title="Network">' + ic("wifi") + "</button>" +
          '<button class="w" data-act="bt" title="Bluetooth">' + ic("bt") + "</button>" +
          '<button class="w" data-act="vol" title="Volume (scroll to change)">' + ic("vol") + "</button>" +
          '<button class="w" data-act="bri" title="Brightness (scroll to change)">' + ic("sun") + "</button>" +
          '<button class="w" data-act="cc" title="Control Center">' + ic("settings") + "</button>" +
          '<button class="w" data-act="session" title="Session">' + ic("power") + "</button>" +
        "</div>" +
      "</div>" +
      // launcher
      '<div class="panel" id="noc-launcher"><div class="search">' + ic("search") +
        '<input id="noc-search" placeholder="Search apps, /calc 21*2 …" autocomplete="off" spellcheck="false"></div>' +
        '<div class="applist" id="noc-apps"></div></div>' +
      // control center
      '<div class="panel" id="noc-cc">' +
        '<div class="cc-head"><div class="av">' + USER[0].toUpperCase() + '</div><div><div class="nm">' + USER + '</div><div class="sub">' + HOST + " · Arch Linux</div></div></div>" +
        '<div class="toggles">' +
          '<div class="tg on" data-t="wifi">' + ic("wifi") + "<span>Wi‑Fi</span></div>" +
          '<div class="tg" data-t="bt">' + ic("bt") + "<span>Bluetooth</span></div>" +
          '<div class="tg" data-t="night">' + ic("moon") + "<span>Night Light</span></div>" +
          '<div class="tg" data-t="dnd">' + ic("bell") + "<span>Do Not Disturb</span></div>" +
        "</div>" +
        '<div class="sld"><label>' + ic("vol") + '<span>Volume</span><span class="val" id="noc-volv">62%</span></label><input type="range" id="noc-vol" min="0" max="100" value="62"></div>' +
        '<div class="sld"><label>' + ic("sun") + '<span>Brightness</span><span class="val" id="noc-briv">80%</span></label><input type="range" id="noc-bri" min="0" max="100" value="80"></div>' +
      "</div>" +
      // session
      '<div class="panel" id="noc-session">' +
        '<div class="sess" data-s="lock">' + ic("lock") + "<span>Lock</span></div>" +
        '<div class="sess" data-s="logout">' + ic("logout") + "<span>Log Out</span></div>" +
        '<div class="sess danger" data-s="reboot">' + ic("restart") + "<span>Reboot</span></div>" +
        '<div class="sess danger" data-s="shutdown">' + ic("power") + "<span>Shut Down</span></div>" +
      "</div>" +
      // calendar
      '<div class="panel" id="noc-cal"></div>' +
      // OSD (structured), notifications, lock
      '<div class="osd" id="noc-osd"><span class="ico">' + ic("vol") + '</span><div class="track"><div class="fill"></div></div><span class="pct"></span></div>' +
      '<div class="notifs" id="noc-notifs"></div>' +
      '<div class="lock" id="noc-lock"><div class="lav">' + USER[0].toUpperCase() + '</div><div class="t" id="noc-lock-t"></div><div class="d" id="noc-lock-d"></div>' +
        '<input id="noc-lock-in" type="password" placeholder="Password" value=""><div class="hint">Press Enter to unlock</div></div>';
    document.body.appendChild(el);
    nocEl = el;

    // workspaces (pill morph)
    const ws = el.querySelector("#noc-ws");
    ws.innerHTML = [1, 2, 3, 4, 5].map((n) => '<b class="' + (n === nocWs ? "on" : "") + '" data-ws="' + n + '"></b>').join("");
    ws.addEventListener("click", (e) => { const b = e.target.closest("b"); if (!b) return; nocWs = +b.getAttribute("data-ws"); syncWorkspaces(); });

    // bar actions
    el.querySelector(".bar").addEventListener("click", (e) => {
      const btn = e.target.closest(".w"); if (!btn) return;
      const act = btn.getAttribute("data-act");
      if (act === "launcher") togglePanel("noc-launcher", () => { const s = el.querySelector("#noc-search"); s.value = ""; renderApps(""); setTimeout(() => s.focus(), 30); });
      else if (act === "cc") togglePanel("noc-cc");
      else if (act === "session") togglePanel("noc-session");
      else if (act === "clock") togglePanel("noc-cal", renderCalendar);
      else if (act === "vol") showOSD("vol", nocVolume);
      else if (act === "bri") showOSD("bri", nocBright);
      // network / bluetooth / notifications / clipboard open the control center hub
      else if (act === "net" || act === "bt" || act === "notif" || act === "clip") togglePanel("noc-cc");
    });
    // scroll to change volume / brightness on their bar widgets
    el.querySelectorAll('[data-act="vol"],[data-act="bri"]').forEach((b) => b.addEventListener("wheel", (e) => {
      e.preventDefault();
      const kind = b.getAttribute("data-act");
      const delta = e.deltaY < 0 ? 3 : -3;
      if (kind === "vol") { nocVolume = Math.max(0, Math.min(100, nocVolume + delta)); showOSD("vol", nocVolume); syncSliders(); }
      else { nocBright = Math.max(0, Math.min(100, nocBright + delta)); showOSD("bri", nocBright); syncSliders(); }
    }, { passive: false }));

    // launcher search
    const search = el.querySelector("#noc-search");
    search.addEventListener("input", () => renderApps(search.value));
    search.addEventListener("keydown", (e) => {
      const apps = [].slice.call(el.querySelectorAll(".app"));
      const cur = el.querySelector(".app.sel");
      if (e.key === "Enter") { (cur || apps[0]) && (cur || apps[0]).click(); e.preventDefault(); }
      else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        let idx = apps.indexOf(cur);
        idx = e.key === "ArrowDown" ? Math.min(apps.length - 1, idx + 1) : Math.max(0, idx - 1);
        apps.forEach((a) => a.classList.remove("sel")); if (apps[idx]) { apps[idx].classList.add("sel"); apps[idx].scrollIntoView({ block: "nearest" }); }
      }
    });

    // control center toggles + sliders
    el.querySelector("#noc-cc").addEventListener("click", (e) => { const t = e.target.closest(".tg"); if (t) t.classList.toggle("on"); });
    const vol = el.querySelector("#noc-vol"), bri = el.querySelector("#noc-bri");
    vol.addEventListener("input", () => { nocVolume = +vol.value; el.querySelector("#noc-volv").textContent = nocVolume + "%"; showOSD("vol", nocVolume); });
    bri.addEventListener("input", () => { nocBright = +bri.value; el.querySelector("#noc-briv").textContent = nocBright + "%"; showOSD("bri", nocBright); });

    // session actions
    el.querySelector("#noc-session").addEventListener("click", (e) => {
      const sBtn = e.target.closest(".sess"); if (!sBtn) return;
      const a = sBtn.getAttribute("data-s");
      if (a === "lock") nocLock();
      else if (a === "logout") closeNoctalia("logout");
      else if (a === "reboot") { closeNoctalia("silent"); rebootSeq(); }
      else if (a === "shutdown") { closeNoctalia("silent"); poweroffSeq(); }
    });

    // lock unlock
    const lockin = el.querySelector("#noc-lock-in");
    lockin.addEventListener("keydown", (e) => { if (e.key === "Enter") { el.querySelector("#noc-lock").classList.remove("show"); lockin.value = ""; } });
  }

  function syncWorkspaces() {
    if (!nocEl) return;
    nocEl.querySelectorAll("#noc-ws b").forEach((b) => {
      b.classList.toggle("on", +b.getAttribute("data-ws") === nocWs);
    });
  }
  function syncSliders() {
    if (!nocEl) return;
    const vol = nocEl.querySelector("#noc-vol"), bri = nocEl.querySelector("#noc-bri");
    if (vol) { vol.value = nocVolume; nocEl.querySelector("#noc-volv").textContent = nocVolume + "%"; }
    if (bri) { bri.value = nocBright; nocEl.querySelector("#noc-briv").textContent = nocBright + "%"; }
  }

  function setPanelButtons() {
    if (!nocEl) return;
    const openId = NOC_PANELS.find((p) => nocEl.querySelector("#" + p).classList.contains("show"));
    const activeAct = openId ? PANEL_BTN[openId] : null;
    nocEl.querySelectorAll(".bar .w").forEach((w) => w.classList.toggle("active-panel", w.getAttribute("data-act") === activeAct));
  }
  function togglePanel(id, onOpen) {
    const target = nocEl.querySelector("#" + id);
    const wasOpen = target.classList.contains("show");
    NOC_PANELS.forEach((p) => nocEl.querySelector("#" + p).classList.remove("show"));
    if (!wasOpen) { target.classList.add("show"); if (onOpen) onOpen(); }
    setPanelButtons();
  }
  function closePanels() { NOC_PANELS.forEach((p) => nocEl.querySelector("#" + p).classList.remove("show")); setPanelButtons(); }

  function renderApps(q) {
    const list = nocEl.querySelector("#noc-apps");
    q = (q || "").trim();
    if (q.startsWith("/calc") || (/^[\d.\s()+\-*/%]+$/.test(q) && /[+\-*/]/.test(q))) {
      const expr = q.replace(/^\/calc\s*/, "");
      let val = ""; try { val = String(Function('"use strict";return (' + expr + ")")()); } catch (e) { val = "…"; }
      list.innerHTML = '<div class="app sel" data-copy="' + esc(val) + '"><div class="ico" style="background:' + NOC.tertiary + '22;color:' + NOC.tertiary + '">=</div><div><div class="nm">' + esc(expr) + " = " + esc(val) + '</div><div class="desc">calculator · Enter to copy</div></div><span class="go">↵</span></div>';
      bindApps(); return;
    }
    const hits = NOC_APPS.filter((a) => a[0].toLowerCase().includes(q.toLowerCase()));
    list.innerHTML = hits.map((a, idx) =>
      '<div class="app' + (idx === 0 ? " sel" : "") + '" data-app="' + esc(a[0]) + '" style="animation-delay:' + (idx * 22) + 'ms"><div class="ico" style="background:' + a[3] + '22;color:' + a[3] + '">' + a[2] + '</div><div><div class="nm">' + esc(a[0]) + '</div><div class="desc">' + esc(a[1]) + "</div></div><span class=\"go\">↵</span></div>"
    ).join("") || '<div class="app"><div class="ico" style="background:' + NOC.surfaceVariant + '">' + ic("search") + '</div><div class="nm" style="color:' + NOC.onSurfaceVariant + '">No results for “' + esc(q) + "”</div></div>";
    bindApps();
  }
  function bindApps() {
    nocEl.querySelectorAll(".app").forEach((a) => a.onclick = () => {
      const name = a.getAttribute("data-app");
      if (a.getAttribute("data-copy") != null) { closePanels(); pushNotif({ icon: "📋", title: "Copied", body: "Result copied to clipboard", app: "Noctalia" }); return; }
      if (name === "Terminal") { closeNoctalia("logout"); return; }
      if (!name) return;
      closePanels();
      const meta = NOC_APPS.find((x) => x[0] === name) || [name, "", "●", NOC.primary];
      pushNotif({ icon: meta[2], title: name, body: "Launching…", app: meta[1], accent: meta[3] });
    });
  }

  // ---- OSD (volume / brightness) ----
  let osdTimer = null;
  function showOSD(kind, val) {
    if (!nocEl) return;
    const o = nocEl.querySelector("#noc-osd");
    o.querySelector(".ico").innerHTML = ic(kind === "bri" ? "sun" : (val === 0 ? "vol" : "vol"));
    o.querySelector(".fill").style.width = val + "%";
    o.querySelector(".pct").textContent = val + "%";
    o.classList.add("show");
    clearTimeout(osdTimer);
    osdTimer = setTimeout(() => o.classList.remove("show"), 1500);
  }

  // ---- notifications ----
  function pushNotif(n) {
    if (!nocEl) return;
    const wrap = nocEl.querySelector("#noc-notifs");
    const card = document.createElement("div");
    card.className = "notif";
    const accent = n.accent || NOC.primary;
    card.innerHTML =
      '<div class="nico" style="background:' + accent + '22;color:' + accent + '">' + (n.icon || "🔔") + "</div>" +
      '<div style="min-width:0"><div class="ntitle">' + esc(n.title || "") + "</div>" +
      (n.body ? '<div class="nbody">' + esc(n.body) + "</div>" : "") +
      (n.app ? '<div class="napp">' + esc(n.app) + "</div>" : "") + "</div>";
    wrap.appendChild(card);
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add("show")));
    const dismiss = () => { card.classList.remove("show"); card.classList.add("out"); setTimeout(() => card.remove(), 360); };
    card.addEventListener("click", dismiss);
    setTimeout(dismiss, 4800);
  }

  function renderCalendar() {
    if (!nocEl) return;
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    let cells = "";
    ["S", "M", "T", "W", "T", "F", "S"].forEach((d) => cells += '<div class="dow">' + d + "</div>");
    for (let i = 0; i < first; i++) cells += '<div class="d pad"></div>';
    for (let d = 1; d <= days; d++) cells += '<div class="d' + (d === today ? " today" : "") + '">' + d + "</div>";
    nocEl.querySelector("#noc-cal").innerHTML =
      '<div class="cal-top"><span class="m">' + months[m] + '</span><span class="y">' + y + "</span></div>" +
      '<div class="cal-grid">' + cells + "</div>";
  }

  function nocLock() {
    closePanels();
    nocTickLock();
    nocEl.querySelector("#noc-lock").classList.add("show");
    setTimeout(() => nocEl.querySelector("#noc-lock-in").focus(), 60);
  }
  function nocTickLock() {
    if (!nocEl) return;
    const now = new Date();
    const t = nocEl.querySelector("#noc-lock-t"), d = nocEl.querySelector("#noc-lock-d");
    if (t) t.textContent = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    if (d) d.textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }
  function nocTick() {

  // Prefer the linked games.css; if it didn't load (single-file preview), inject
  // the embedded copy so the catalog is styled everywhere.
  function ggrStyle() {
    if (document.getElementById("ggr-style-fb")) return;
    let loaded = false;
    try {
      for (const ss of document.styleSheets) {
        if (ss.href && /games\.css(\?|$)/.test(ss.href)) { try { loaded = !!(ss.cssRules && ss.cssRules.length); } catch (e) { loaded = true; } }
      }
    } catch (e) {}
    if (loaded) return;
    const blk = document.getElementById("games-css");

  // Load the real catalog (games-data.js / games-noicon.js) relative to the page,
  // so it works on the deployed site and locally; fall back to the bundled sample.
  function ggrLoadGames() {
    if (ggrGames) return Promise.resolve(ggrGames);
    return new Promise((resolve) => {
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        let withIcons = [], ugs = [];
        try { if (Array.isArray(window.GAME_DATA)) withIcons = window.GAME_DATA.filter((e) => e && e[3]).map((e) => [e[3], e[1], e[2]]); } catch (e) {}
        try { if (Array.isArray(window.NOICON_GAMES)) ugs = window.NOICON_GAMES.filter((e) => e && e[3]).map((e) => [e[3], e[1]]); } catch (e) {}
        if (!withIcons.length) { withIcons = GGR_FALLBACK.withIcons; ugs = GGR_FALLBACK.ugs; ggrGames = { withIcons: withIcons, ugs: ugs, live: false }; }
        else ggrGames = { withIcons: withIcons, ugs: ugs, live: true };
        resolve(ggrGames);
      };
      if (Array.isArray(window.GAME_DATA)) { finish(); return; }
      let pending = 2;
      const oneDone = () => { if (--pending <= 0) finish(); };
      ["games-data.js", "games-noicon.js"].forEach((f) => {
        const sc = document.createElement("script");
        sc.src = f; sc.async = true;
        sc.onload = oneDone; sc.onerror = oneDone;
        document.head.appendChild(sc);
      });
      setTimeout(finish, 8000); // offline / single-file fallback
    });
  }

  // ------------------------------------------------------ register new commands
  function fileOrStdin(args) {
    const files = args.filter((a) => !a.startsWith("-") && readFileAt(a) != null);
    if (files.length) return files.map((f) => readFileAt(f)).join("");
    return CURRENT_STDIN != null ? CURRENT_STDIN : "";
  }
  Object.assign(commands, {
    node: (a) => runNode(a),
    js: (a) => runNode(a),
    bash(a) {
      const f = a.find((x) => !x.startsWith("-"));
      if (f) { const src = readFileAt(f); if (src == null) { outText("bash: " + f + ": No such file or directory"); LAST_STATUS = 127; return; } return runBash(src, a.slice(a.indexOf(f) + 1)); }
      if (a.includes("-c")) { return execLine(a[a.indexOf("-c") + 1] || ""); }
      outText("GNU bash, version 5.2.26(1)-release. Type commands directly, or `bash script.sh`.");
    },
    sh(a) { return commands.bash(a); },
    gcc: (a) => runGcc(a, false), cc: (a) => runGcc(a, false), clang: (a) => runGcc(a, false),
    "g++": (a) => runGcc(a, true), "c++": (a) => runGcc(a, true),
    make: (a) => runMake(a),
    meson: () => outText("meson: run inside a project. Noctalia builds via `pacman -S noctalia-shell`."),
    ninja: () => outText("ninja: no build directory. Configure a meson project first."),
    just: () => outText("just: command runner — see the project justfile."),
    noctalia: () => launchNoctalia(),
    "noctalia-shell": () => launchNoctalia(),
    qs: () => launchNoctalia(),
    git: (a) => gitCmd(a),
    grep(a) {
      const rest = a.filter((x) => !x.startsWith("-"));
      const files = rest.slice(1);
      const text = files.length ? files.map((f) => readFileAt(f) || "").join("") : (CURRENT_STDIN || "");
      if (!rest.length) { outText("usage: grep [-i] PATTERN [FILE...]"); return; }
      FILTERS.grep(text, a).forEach((l) => outText(l));
    },
    wc(a) { FILTERS.wc(fileOrStdin(a), a).forEach((l) => outText(l)); },
    sort(a) { FILTERS.sort(fileOrStdin(a), a).forEach((l) => outText(l)); },
    tail(a) { FILTERS.tail(fileOrStdin(a), a).forEach((l) => outText(l)); },
    uniq(a) { FILTERS.uniq(fileOrStdin(a), a).forEach((l) => outText(l)); },
    rev(a) { FILTERS.rev(fileOrStdin(a), a).forEach((l) => outText(l)); },
    export(a, raw) { const m = (raw || "").match(/^export\s+([A-Za-z_]\w*)=(.*)$/); if (m) { ENV[m[1]] = m[2].replace(/^["']|["']$/g, ""); persist(); } },
    set() { for (const k of Object.keys(ENV)) outText(k + "=" + ENV[k]); },
    printenv(a) { if (a[0]) outText(ENV[a[0]] || ""); else for (const k of Object.keys(ENV)) outText(k + "=" + ENV[k]); },
    "reset-fs"() { try { localStorage.removeItem(FS_KEY); } catch (e) {} out('<span class="warn">Filesystem reset. Reloading…</span>'); setTimeout(() => location.reload(), 500); },
  });

  // ---- coreutils / shell builtins (authenticity pass) ----------------------
  Object.assign(commands, {
    printf(a) {
      let fmt = a[0] != null ? a[0] : "";
      fmt = fmt.replace(/\\n/g, "\n").replace(/\\t/g, "\t").replace(/\\r/g, "\r").replace(/\\\\/g, "\\").replace(/\\"/g, '"');
      let i = 1;
      const s = fmt.replace(/%[-+ 0-9.]*[sdifxXcou%]/g, (spec) => {
        if (spec === "%%") return "%";
        const conv = spec[spec.length - 1]; const v = a[i++];
        if (conv === "d" || conv === "i") return String(Math.trunc(Number(v) || 0));
        if (conv === "u") return String((Math.trunc(Number(v) || 0)) >>> 0);
        if (conv === "x") return ((Math.trunc(Number(v) || 0)) >>> 0).toString(16);
        if (conv === "X") return ((Math.trunc(Number(v) || 0)) >>> 0).toString(16).toUpperCase();
        if (conv === "o") return ((Math.trunc(Number(v) || 0)) >>> 0).toString(8);
        if (conv === "f") { const m = spec.match(/\.(\d+)/); return (Number(v) || 0).toFixed(m ? +m[1] : 6); }
        if (conv === "c") return String(v == null ? "" : v).slice(0, 1);
        if (conv === "s") return v == null ? "" : String(v);
        return spec;
      });
      s.split("\n").forEach((l, idx, arr) => { if (idx === arr.length - 1 && l === "") return; outText(l); });
    },
    cd(a) {
      let t = a[0] || "~", show = false;
      if (t === "-") { t = ENV.OLDPWD || ("/" + cwd.join("/")); show = true; }
      const r = resolve(t);
      if (!r.node) { outText("cd: " + (a[0] || "") + ": No such file or directory"); LAST_STATUS = 1; return; }
      if (r.node.type !== "dir") { outText("cd: " + (a[0] || "") + ": Not a directory"); LAST_STATUS = 1; return; }
      ENV.OLDPWD = "/" + cwd.join("/");
      cwd = r.parts;
      ENV.PWD = "/" + cwd.join("/");
      if (show) outText(ENV.PWD);
    },
    chmod(a) {
      const nf = a.filter((x) => !x.startsWith("-") || /^-?[rwx+-]+$/.test(x) === false);
      const mode = a.filter((x) => !x.startsWith("-"))[0] || a.find((x) => /[+-][rwx]/.test(x)) || "";
      const files = a.filter((x) => !x.startsWith("-") && x !== mode);
      const setX = /\+x/.test(mode) || /^[0-7]?[0-7]?[1357]$/.test(mode);
      const clrX = /-x/.test(mode) && !/\+/.test(mode);
      for (const f of files) {
        const r = resolve(f);
        if (!r.node) { outText("chmod: cannot access '" + f + "': No such file or directory"); LAST_STATUS = 1; continue; }
        if (setX) r.node.exe = true; else if (clrX) r.node.exe = false;
      }
      persist();
    },
    async sleep(a) { let sec = parseFloat(a[0]) || 0; sec = Math.min(sec, 6); if (sec > 0 && !reduceMotion) await sleep(sec * 1000); },
    seq(a) {
      const n = a.filter((x) => !x.startsWith("-")).map(Number);
      let first = 1, incr = 1, last;
      if (n.length === 1) last = n[0]; else if (n.length === 2) { first = n[0]; last = n[1]; } else { first = n[0]; incr = n[1]; last = n[2]; }
      if (last == null || isNaN(last)) { outText("seq: missing operand"); LAST_STATUS = 1; return; }
      if (incr > 0) for (let i = first; i <= last + 1e-9; i += incr) outText(String(+i.toFixed(6)));
      else if (incr < 0) for (let i = first; i >= last - 1e-9; i += incr) outText(String(+i.toFixed(6)));
    },
    basename(a) { let p = (a[0] || "").replace(/\/+$/, ""); let b = p.split("/").pop() || "/"; if (a[1] && b.endsWith(a[1]) && b !== a[1]) b = b.slice(0, -a[1].length); outText(b); },
    dirname(a) { let p = (a[0] || "").replace(/\/+$/, ""); const i = p.lastIndexOf("/"); outText(i < 0 ? "." : (i === 0 ? "/" : p.slice(0, i))); },
    cut(a) {
      let delim = "\t", fields = "1";
      for (let i = 0; i < a.length; i++) {
        const x = a[i];
        if (x === "-d") delim = a[++i] || "\t";
        else if (x.startsWith("-d")) delim = x.slice(2);
        else if (x === "-f") fields = a[++i] || "1";
        else if (x.startsWith("-f")) fields = x.slice(2);
      }
      if (delim === "\\t") delim = "\t";
      const fset = fields.split(",").map(Number);
      fileOrStdin(a).replace(/\n$/, "").split("\n").forEach((line) => {
        const parts = line.split(delim);
        outText(fset.map((f) => (parts[f - 1] != null ? parts[f - 1] : "")).join(delim));
      });
    },
    du(a) {
      const node = nodeAt(cwd);
      const size = (nd) => nd.type === "file" ? (nd.content || "").length : Object.keys(nd.children).reduce((s, k) => s + size(nd.children[k]), 0);
      const h = a.some((x) => x.includes("h"));
      const b = size(node);
      const fmt = h ? (b > 1048576 ? (b / 1048576).toFixed(1) + "M" : b > 1024 ? Math.ceil(b / 1024) + "K" : b + "") : String(Math.max(1, Math.ceil(b / 1024)));
      outText(fmt + "\t.");
    },
    ps(a) {
      const aux = a.join("").includes("a");
      if (aux) outLines([
        "USER         PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND",
        "root           1  0.0  0.1 168920 12184 ?        Ss   08:41   0:01 /sbin/init",
        "root         318  0.0  0.2 402100 25600 ?        Ssl  08:41   0:02 /usr/lib/systemd/systemd-journald",
        "root         690  0.0  0.1 234100 15600 ?        Ss   08:41   0:00 /usr/lib/systemd/systemd-logind",
        USER + "        1288  0.0  0.2 225140 18004 tty1     S    08:41   0:00 -bash",
        USER + "        1902  0.0  0.1 210344 11200 tty1     R+   08:42   0:00 ps aux",
      ]);
      else outLines([
        "    PID TTY          TIME CMD",
        "   1288 tty1     00:00:00 bash",
        "   1902 tty1     00:00:00 ps",
      ]);
    },
    alias(a, raw) {
      const m = (raw || "").match(/^alias\s+([A-Za-z_][\w-]*)=(.*)$/s);
      if (m) { ALIASES[m[1]] = m[2].replace(/^["']|["']$/g, ""); persist(); return; }
      const names = a.filter((x) => !x.startsWith("-"));
      const keys = names.length ? names : Object.keys(ALIASES).sort();
      for (const k of keys) { if (ALIASES[k] != null) outText("alias " + k + "='" + ALIASES[k] + "'"); else if (names.length) outText("bash: alias: " + k + ": not found"); }
    },
    unalias(a) { for (const n of a.filter((x) => !x.startsWith("-"))) delete ALIASES[n]; persist(); },
    type(a) {
      const builtins = ["cd", "echo", "export", "alias", "unalias", "pwd", "help", "exit", "printf", "test", "source", ".", ":", "true", "false", "history", "type"];
      for (const n of a) {
        if (ALIASES[n]) outText(n + " is aliased to `" + ALIASES[n] + "'");
        else if (builtins.includes(n)) outText(n + " is a shell builtin");
        else if (commands[n] || n === "pacman" || n === "git") outText(n + " is /usr/bin/" + n);
        else { outText("bash: type: " + n + ": not found"); LAST_STATUS = 1; }
      }
    },
    "true"() { LAST_STATUS = 0; },
    "false"() { LAST_STATUS = 1; },
    ":"() { LAST_STATUS = 0; },
    groups() { outText("wheel network power sys " + USER); },
    logname() { outText(USER); },
    tty() { outText("/dev/tty1"); },
    yes(a) { const w = a.join(" ") || "y"; for (let i = 0; i < 20; i++) outText(w); outText("… (^C)"); },
  });

  // ======================================================================
  //  HTML viewer + editor
  // ======================================================================
  const viewer = $("#viewer");
  const frame = $("#viewer-frame");
  const viewerUrl = $("#viewer-url");

  function openTarget(arg, via) {
    if (!arg) { outText((via || "xdg-open") + ": no file specified"); return; }
    // allow opening real external urls-ish? keep local files only for authenticity
    const r = resolve(arg);
    if (!r.node) { outText((via || "xdg-open") + ": " + arg + ": No such file or directory"); return; }
    if (r.node.type === "dir") { outText((via || "xdg-open") + ": " + arg + ": Is a directory"); return; }
    const isHtml = r.node.html || /\.html?$/.test(arg);
    const isSvg = r.node.svg || /\.svg$/.test(arg);
    if (!isHtml && !isSvg) {
      outText((via || "xdg-open") + ": opening non-HTML files isn't supported here — try `cat " + arg + "` or `nano " + arg + "`.");
      return;
    }
    const full = "/" + r.parts.join("/");
    out('<span class="muted">Opening </span><span class="html">' + esc(displayPath(r.parts)) + '</span><span class="muted"> in ' + (via || "the browser") + "…</span>");
    viewerUrl.innerHTML = '<b>file://</b>' + esc(full);
    viewer.classList.add("open");
    const body = isSvg
      ? "<!doctype html><meta charset=utf-8><style>html,body{margin:0;height:100%;background:#070722;display:grid;place-items:center}svg{width:min(70vmin,420px);height:auto}</style>" + r.node.content
      : r.node.content;
    renderIntoFrame(body);
  }
  // Write the page into a same-origin sandboxed about:blank iframe. This is the
  // most CSP-robust path (the frame inherits the host page's origin and policy);
  // srcdoc is kept as a fallback for engines that block the write.
  function renderIntoFrame(html) {
    try {
      const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
      if (doc) { doc.open(); doc.write(html); doc.close(); return; }
    } catch (e) { /* fall through */ }
    try { frame.srcdoc = html; } catch (e) { /* nothing else to do */ }
  }
  function closeViewer() {
    viewer.classList.remove("open");
    renderIntoFrame("<!doctype html><title></title>");
    frame.removeAttribute("srcdoc");
    focusInput();
  }
  $("#viewer-close").addEventListener("click", closeViewer);
  viewer.addEventListener("click", (e) => { if (e.target === viewer) closeViewer(); });

  // ---- nano-style editor ----
  const editor = $("#editor");
  const edArea = $("#ed-area");
  const edStatus = $("#ed-status");
  const edFile = $("#ed-file");
  const edTitle = $("#ed-title");
  let edCtx = null; // { name, parts, isNew }

  function openEditor(name, isVim) {
    if (!name) { outText((isVim ? "vim" : "nano") + ": missing filename"); return; }
    const parts = pathParts(name);
    const node = nodeAt(parts);
    let content = "";
    let isNew = true;
    if (node) {
      if (node.type === "dir") { outText("nano: " + name + ": Is a directory"); return; }
      content = node.content || ""; isNew = false;
    }
    edCtx = { name, parts, isNew };
    edArea.value = content;
    edFile.textContent = (isNew ? "New Buffer — " : "") + name;
    edTitle.textContent = isVim ? "VIM (nano keys)  " : "GNU nano 8.1";
    edStatus.textContent = isNew ? "[ New File ]" : "[ Read " + content.split("\n").length + " lines ]";
    editor.classList.add("open");
    setTimeout(() => edArea.focus(), 30);
    inputEnabled = false;
  }
  function saveEditor() {
    const parts = edCtx.parts;
    const parent = parentOf(parts);
    const fname = parts[parts.length - 1];
    if (!parent || parent.type !== "dir") { edStatus.textContent = "[ Error: cannot write to that path ]"; return; }
    const isHtml = /\.html?$/.test(fname);
    parent.children[fname] = { type: "file", content: edArea.value, html: isHtml };
    const lines = edArea.value.split("\n").length;
    edStatus.textContent = "[ Wrote " + lines + " lines ]";
    edCtx.isNew = false;
  }
  function exitEditor() {
    editor.classList.remove("open");
    edCtx = null;
    inputEnabled = true;
    if (!inputLine) makeInputLine(); // return to a fresh shell prompt, like nano does
    focusInput();
  }
  edArea.addEventListener("keydown", (e) => {
    if (e.ctrlKey && (e.key === "o" || e.key === "O")) { e.preventDefault(); saveEditor(); }
    else if (e.ctrlKey && (e.key === "x" || e.key === "X")) { e.preventDefault(); saveEditor(); exitEditor(); }
    else if (e.ctrlKey && (e.key === "k" || e.key === "K")) {
      e.preventDefault();
      // cut current line
      const v = edArea.value, pos = edArea.selectionStart;
      let ls = v.lastIndexOf("\n", pos - 1) + 1;
      let le = v.indexOf("\n", pos); if (le === -1) le = v.length; else le += 1;
      edArea.value = v.slice(0, ls) + v.slice(le);
      edArea.selectionStart = edArea.selectionEnd = ls;
    }
  });

  // ======================================================================
  //  Prompt / input handling
  // ======================================================================
  let buffer = "";
  let cursorPos = 0;
  let inputEnabled = false;
  let promptStr = "";

  function computePrompt() {
    promptStr = "[" + USER + "@" + HOST + " " + baseName() + "]$ ";
  }
  function baseName() {
    const dp = displayPath(cwd);
    if (dp === "~") return "~";
    const segs = dp.split("/");
    return segs[segs.length - 1] || "/";
  }

  function makeInputLine() {
    computePrompt();
    inputLine = document.createElement("div");
    inputLine.className = "line";
    screen.appendChild(inputLine);
    buffer = ""; cursorPos = 0;
    renderInput();
    scrollDown();
  }

  function renderInput() {
    if (!inputLine) return;
    const before = esc(buffer.slice(0, cursorPos));
    const at = buffer.slice(cursorPos, cursorPos + 1);
    const after = esc(buffer.slice(cursorPos + 1));
    const cursorChar = at ? esc(at) : " ";
    const focused = document.activeElement === kb || document.activeElement === screen || document.hasFocus();
    inputLine.innerHTML =
      '<span class="arch-b">[</span>' +
      '<span class="fg-bright">' + USER + "</span>@" +
      '<span class="fg-bright">' + HOST + "</span> " +
      '<span class="dir">' + esc(baseName()) + "</span>" +
      '<span class="arch-b">]$</span> ' +
      before +
      '<span id="cursor" class="' + (focused ? "" : "hollow") + '">' + cursorChar + "</span>" +
      after;
  }

  function focusInput() {
    // focus hidden input to raise mobile keyboard, but keep desktop key handling on document
    try { kb.focus({ preventScroll: true }); } catch (e) {}
  }

  function freezeInputLine() {
    // convert active line to static (remove cursor)
    if (!inputLine) return;
    inputLine.innerHTML =
      '<span class="arch-b">[</span>' +
      '<span class="fg-bright">' + USER + "</span>@" +
      '<span class="fg-bright">' + HOST + "</span> " +
      '<span class="dir">' + esc(baseName()) + "</span>" +
      '<span class="arch-b">]$</span> ' + esc(buffer);
    inputLine = null;
  }

  // ---- command runner ----
  function tokenize(line) {
    const m = line.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g) || [];
    return m.map((t) => t.replace(/^["']|["']$/g, ""));
  }

  async function runLine(line, silent) {
    const trimmed = line.trim();
    // a pending Y/N confirmation consumes this line instead of running it
    if (pendingConfirm) {
      const cb = pendingConfirm; pendingConfirm = null;
      await cb(/^y(es)?$/i.test(trimmed));
      return;
    }
    if (!trimmed) return;
    if (!silent) { HISTORY.push(trimmed); histIdx = HISTORY.length; }
    // hidden custom command-launcher / game-mode commands (never reach dispatch)
    if (await ggrIntercept(trimmed)) return;
    ENV.PWD = "/" + cwd.join("/");
    // full command line: variable/command expansion, ; && || pipes redirects, ./exec
    await execLine(trimmed);
  }

  async function submit() {
    const line = buffer;
    freezeInputLine();
    inputEnabled = false;
    await runLine(line, false);
    inputEnabled = true;
    if (!editor.classList.contains("open") && !noctaliaOpen) makeInputLine();
    persist();
    scrollDown();
  }

  // ---- tab completion ----
  function complete() {
    const tokens = buffer.slice(0, cursorPos).split(/\s+/);
    const isFirst = tokens.length <= 1;
    const frag = tokens[tokens.length - 1] || "";
    let options = [];
    if (isFirst) {
      options = Object.keys(commands).concat(["pacman", "ll"]).filter((c) => c.startsWith(frag));
    } else {
      // path completion
      let dirPart = "", base = frag;
      const slash = frag.lastIndexOf("/");
      if (slash >= 0) { dirPart = frag.slice(0, slash + 1); base = frag.slice(slash + 1); }
      const r = resolve(dirPart || ".");
      if (r.node && r.node.type === "dir")
        options = Object.keys(r.node.children)
          .filter((n) => n.startsWith(base))
          .map((n) => dirPart + n + (r.node.children[n].type === "dir" ? "/" : ""));
    }
    if (options.length === 1) {
      const rest = options[0].slice(frag.length);
      buffer = buffer.slice(0, cursorPos) + rest + buffer.slice(cursorPos);
      cursorPos += rest.length;
      renderInput();
    } else if (options.length > 1) {
      // common prefix
      let prefix = options[0];
      for (const o of options) { while (!o.startsWith(prefix)) prefix = prefix.slice(0, -1); }
      if (prefix.length > frag.length) {
        const rest = prefix.slice(frag.length);
        buffer = buffer.slice(0, cursorPos) + rest + buffer.slice(cursorPos);
        cursorPos += rest.length;
      } else {
        freezeInputLine();
        out(options.map((o) => {
          const bare = o.replace(/\/$/, "");
          return o.endsWith("/") ? '<span class="dir">' + esc(bare) + "/</span>" : esc(o);
        }).join("   "));
        makeInputLine();
        buffer = tokens.slice(0, -1).concat(frag).join(" ");
        // restore what was typed
        buffer = (buffer.length ? buffer : frag);
      }
      renderInput();
    }
  }

  // ---- keyboard ----
  function onKey(e) {
    if (booting) { skipBoot(); return; }
    if (ggrOpen) { ggrKey(e); return; } // game catalog captures keys
    if (noctaliaOpen) { nocKey(e); return; } // Noctalia session captures keys
    if (editor.classList.contains("open")) return; // editor handles its own keys
    if (viewer.classList.contains("open")) {
      if (e.key === "Escape") closeViewer();
      return;
    }
    if (!inputEnabled) {
      // allow Ctrl+C to interrupt
      if (e.ctrlKey && (e.key === "c" || e.key === "C")) { /* no-op during async */ }
      return;
    }

    const k = e.key;

    if (e.ctrlKey) {
      if (k === "l" || k === "L") { e.preventDefault(); commands.clear(); return; }
      if (k === "c" || k === "C") {
        e.preventDefault();
        // echo ^C, abandon the current line, and drop to a fresh prompt
        buffer += "^C";
        cursorPos = buffer.length;
        renderInput();
        freezeInputLine();
        makeInputLine();
        return;
      }
      if (k === "u" || k === "U") { e.preventDefault(); buffer = buffer.slice(cursorPos); cursorPos = 0; renderInput(); return; }
      if (k === "a" || k === "A") { e.preventDefault(); cursorPos = 0; renderInput(); return; }
      if (k === "e" || k === "E") { e.preventDefault(); cursorPos = buffer.length; renderInput(); return; }
      if (k === "k" || k === "K") { e.preventDefault(); buffer = buffer.slice(0, cursorPos); renderInput(); return; }
      if (k === "w" || k === "W") {
        e.preventDefault();
        const left = buffer.slice(0, cursorPos).replace(/\s*\S+\s*$/, "");
        buffer = left + buffer.slice(cursorPos); cursorPos = left.length; renderInput(); return;
      }
      return;
    }

    if (k === "Enter") { e.preventDefault(); submit(); return; }
    if (k === "Backspace") {
      e.preventDefault();
      if (cursorPos > 0) { buffer = buffer.slice(0, cursorPos - 1) + buffer.slice(cursorPos); cursorPos--; renderInput(); }
      return;
    }
    if (k === "Delete") {
      e.preventDefault();
      buffer = buffer.slice(0, cursorPos) + buffer.slice(cursorPos + 1); renderInput(); return;
    }
    if (k === "ArrowLeft") { e.preventDefault(); if (cursorPos > 0) cursorPos--; renderInput(); return; }
    if (k === "ArrowRight") { e.preventDefault(); if (cursorPos < buffer.length) cursorPos++; renderInput(); return; }
    if (k === "Home") { e.preventDefault(); cursorPos = 0; renderInput(); return; }
    if (k === "End") { e.preventDefault(); cursorPos = buffer.length; renderInput(); return; }
    if (k === "ArrowUp") {
      e.preventDefault();
      if (histIdx > 0) { histIdx--; buffer = HISTORY[histIdx] || ""; cursorPos = buffer.length; renderInput(); }
      return;
    }
    if (k === "ArrowDown") {
      e.preventDefault();
      if (histIdx < HISTORY.length) { histIdx++; buffer = HISTORY[histIdx] || ""; cursorPos = buffer.length; renderInput(); }
      return;
    }
    if (k === "Tab") { e.preventDefault(); complete(); return; }

    if (k.length === 1 && !e.metaKey) {
      e.preventDefault();
      buffer = buffer.slice(0, cursorPos) + k + buffer.slice(cursorPos);
      cursorPos++;
      renderInput();
    }
  }

  // mobile: feed the hidden input's characters through
  kb.addEventListener("input", () => {

  // ======================================================================
  //  Boot sequence
  // ======================================================================
  let booting = true;
  let bootSkipped = false;

  const KLINE = (t, msg) => '<span class="muted">[</span>' + '<span class="muted">' + pad(t, 11) + "</span>" +

  function okLine(msg, state) {
    const s = state || "OK";
    let inner;

    else if (s === "FAIL") inner = '<span class="fail">FAILED</span>';

  }

  const BOOT = [
    { t: "k", d: 0, h: KLINE("0.000000", "Linux version " + KVER + " (linux@archlinux) (gcc (GCC) 14.2.1 20240805, GNU ld (GNU Binutils) 2.43.0) #1 SMP PREEMPT_DYNAMIC") },
    { t: "k", d: 30, h: KLINE("0.000000", "Command line: BOOT_IMAGE=/vmlinuz-linux root=UUID=4f9a1c8e-2b7d-4a6f-9e3c-1b8a0d5f2e7c rw loglevel=3 quiet") },
    { t: "k", d: 20, h: KLINE("0.004221", "KERNEL supported cpus:") },
    { t: "k", d: 10, h: KLINE("0.181934", "smpboot: CPU0: AMD Ryzen 7 5800X 8-Core Processor (family: 0x19, model: 0x21)") },
    { t: "k", d: 26, h: KLINE("0.402118", "Memory: 16299184K/16777216K available (14336K kernel code, 2489K rwdata)") },
    { t: "k", d: 22, h: KLINE("0.618402", "systemd[1]: systemd 256.5-1-arch running in system mode (+PAM +AUDIT +SELINUX)") },
    { t: "k", d: 18, h: KLINE("0.641190", "systemd[1]: Detected architecture x86-64.") },
    { t: "k", d: 16, h: KLINE("0.659003", "systemd[1]: Hostname set to <" + HOST + ">.") },
    { t: "blank" },
    { t: "s", d: 40, h: okLine("Created slice Slice /system/getty.") },
    { t: "s", d: 34, h: okLine("Created slice Slice /system/modprobe.") },
    { t: "s", d: 30, h: okLine("Reached target Local Encrypted Volumes.") },
    { t: "s", d: 44, h: okLine("Started Journal Service.") },
    { t: "s", d: 30, h: okLine("Mounted /boot.") },
    { t: "s", d: 40, h: okLine("Reached target Local File Systems.") },
    { t: "s", d: 50, h: okLine("Started Load/Save OS Random Seed.") },
    { t: "s", d: 36, h: okLine("Reached target System Initialization.") },
    { t: "s", d: 46, h: okLine("Started Daily man-db regeneration.") },
    { t: "s", d: 30, h: okLine("Started D-Bus System Message Bus.") },
    { t: "s", d: 58, h: okLine("Started Network Manager.") },
    { t: "s", d: 40, h: okLine("Reached target Network.") },
    { t: "s", d: 34, h: okLine("Started OpenSSH Daemon.") },
    { t: "s", d: 30, h: okLine("Started Permit User Sessions.") },
    { t: "s", d: 44, h: okLine("Started Getty on tty1.") },
    { t: "s", d: 30, h: okLine("Reached target Login Prompts.") },
    { t: "s", d: 30, h: okLine("Reached target Multi-User System.") },
    { t: "s", d: 30, h: okLine("Reached target Graphical Interface.") },
    { t: "blank" },
  ];

  async function runBoot() {
    // reduced motion / returning users: dump instantly
    for (const step of BOOT) {
      if (bootSkipped) break;
      if (step.t === "blank") out("");
      else out(step.h);
      if (!reduceMotion && !bootSkipped) await sleep(step.d || 20);
    }
    if (!bootSkipped) await loginSequence();
    else finishBoot();
  }

  async function loginSequence() {
    out('<span class="fg-bright b">Arch Linux ' + KVER + " (tty1)</span>");
    out("");
    // login: prompt with typed username
    const loginLine = out("");
    loginLine.innerHTML = HOST + " login: ";
    if (!reduceMotion) await sleep(500);
    let typed = "";
    for (const ch of USER) {
      if (bootSkipped) break;
      typed += ch;
      loginLine.innerHTML = HOST + " login: " + '<span class="fg-bright">' + esc(typed) + "</span>";
      scrollDown();
      if (!reduceMotion) await sleep(rint(70, 150));
    }
    if (!reduceMotion && !bootSkipped) await sleep(250);
    const passLine = out("");
    passLine.innerHTML = "Password: ";
    if (!reduceMotion && !bootSkipped) await sleep(700);
    out('<span class="muted">Last login: Sun Aug 20 08:41:03 2026 on tty1</span>');
    finishBoot();
  }

  function finishBoot() {
    booting = false;
    inputEnabled = true;
    hint.style.opacity = "0";
    // run .bashrc greeter (fastfetch) then hand over the prompt
    fastfetch();
    makeInputLine();
    focusInput();
  }

  function skipBoot() {
    if (!booting || bootSkipped) return;
    bootSkipped = true;
  }

  // ======================================================================
  //  reboot / poweroff
  // ======================================================================
  async function poweroffSeq() {
    inputEnabled = false;
    freezeInputLine();
    out("");
    const lines = [
      okLine("Stopped target Graphical Interface."),
      okLine("Stopped OpenSSH Daemon."),
      okLine("Stopped Network Manager."),
      okLine("Unmounted /boot."),
      okLine("Reached target Power-Off."),
    ];
    for (const l of lines) { out(l); await sleep(reduceMotion ? 0 : 160); }
    await sleep(reduceMotion ? 0 : 400);
    out("");
    out('<span class="muted">System halted. </span><a href="#" id="restart">Power on again</a>');
    document.getElementById("restart").addEventListener("click", (e) => { e.preventDefault(); location.reload(); });
  }

  async function rebootSeq() {
    inputEnabled = false;
    freezeInputLine();
    out("");
    out(okLine("Reached target Reboot."));
    await sleep(reduceMotion ? 0 : 500);
    location.reload();
  }

  // ======================================================================
  //  boot
  // ======================================================================
  const hint = $("#hint");
  hint.textContent = "press any key to skip boot";
  loadState(); // restore a previous session's filesystem, installs & history
  window.addEventListener("beforeunload", persist);
  focusInput();
  runBoot();

})();
</script>
