<title>Arch Linux WebTTY</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"

<!-- GGR catalog stylesheet (loads on the deployed site; index.html carries an
     inline fallback for single-file previews). -->
<link rel="stylesheet" href="games.css" />

<style>
  /*
    Arch Linux WebTTY — a committed single-visual-world design (a real black TTY).
    Everything is painted explicitly so it holds on any host ground; no theme toggle
    by design, because the whole point is a full-black Arch console.
  */
  :root {
    --bg: #000000;
    --fg: #c9ccd1;          /* console foreground, a touch off pure white */
    --fg-bright: #ffffff;   /* the white accent */
    --arch: #1793d1;        /* fastfetch FF_COLOR_FG_CYAN — the iconic Arch blue */
    --arch-dim: #0f6ea3;
    --ok: #4e9a06;          /* systemd [  OK  ] green */
    --ok-bright: #8ae234;
    --fail: #cc0000;
    --warn: #c4a000;
    --muted: #6b7078;
    --sel: #1793d1;

    /* xterm 16-color palette for ls / fastfetch color blocks */
    --c0: #000000; --c1: #cc0000; --c2: #4e9a06; --c3: #c4a000;
    --c4: #3465a4; --c5: #75507b; --c6: #06989a; --c7: #d3d7cf;
    --c8: #555753; --c9: #ef2929; --c10: #8ae234; --c11: #fce94f;
    --c12: #729fcf; --c13: #ad7fa8; --c14: #34e2e2; --c15: #eeeeec;

    --mono: "JetBrains Mono", "DejaVu Sans Mono", "Cascadia Mono", "Consolas",
      "Menlo", ui-monospace, monospace;
    --fs: 15px;
    --lh: 1.35;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    font-family: var(--mono);
    font-size: var(--fs);
    line-height: var(--lh);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* The TTY screen fills the viewport, scrolls internally like a console. */
  #screen {
    position: fixed;
    inset: 0;
    padding: 10px 14px 22px;
    overflow-y: auto;
    overflow-x: hidden;
    white-space: pre-wrap;
    word-break: break-word;
    scrollbar-width: thin;
    scrollbar-color: #2a2d31 transparent;
    /* faint scanline-free CRT vignette; kept subtle so text stays crisp */
    background:
      radial-gradient(120% 120% at 50% 0%, rgba(23, 147, 209, 0.03), transparent 55%),
      var(--bg);
  }
  #screen::-webkit-scrollbar { width: 10px; }
  #screen::-webkit-scrollbar-thumb { background: #26292d; border-radius: 8px; }
  #screen::-webkit-scrollbar-track { background: transparent; }

  .line { white-space: pre-wrap; }

  /* color utility classes mirroring ANSI console colors */
  .fg-bright { color: var(--fg-bright); }
  .arch { color: var(--arch); }
  .arch-b { color: var(--arch); font-weight: 700; }
  .ok { color: var(--ok-bright); }
  .fail { color: var(--fail); }
  .warn { color: var(--warn); }
  .muted { color: var(--muted); }
  .b { font-weight: 700; }
  .dir { color: var(--c12); font-weight: 700; }
  .exe { color: var(--c10); font-weight: 700; }
  .lnk { color: var(--c14); font-weight: 700; }
  .html { color: var(--c13); font-weight: 700; }
  .red { color: var(--c9); }
  .green { color: var(--c10); }
  .yellow { color: var(--c11); }
  .blue { color: var(--c12); }
  .magenta { color: var(--c13); }
  .cyan { color: var(--c14); }
  .white { color: var(--c15); }

  /* systemd status tag [  OK  ] */
  .tag { color: var(--fg-bright); }

  /* fastfetch layout */
  .ff { display: flex; gap: 18px; align-items: flex-start; margin: 2px 0 6px; }
  .ff-logo {
    color: var(--arch);
    font-weight: 700;
    white-space: pre;
    line-height: 1.15;
    flex: 0 0 auto;
  }
  .ff-info { white-space: pre; line-height: 1.45; }
  .ff-title { color: var(--arch); font-weight: 700; }
  .ff-key { color: var(--arch); font-weight: 700; }
  .ff-sep { color: var(--muted); }
  .ff-blocks { display: flex; margin-top: 6px; }
  .ff-blocks .blk { width: 1.35em; height: 1.05em; display: inline-block; }
  @media (max-width: 640px) {
    .ff { flex-direction: column; gap: 4px; }
    .ff-logo { font-size: 8px; line-height: 1.05; }
  }

  /* active input line */
  #cursor {
    display: inline-block;
    background: var(--fg);
    color: var(--bg);
    animation: blink 1s steps(1) infinite;
  }
  #cursor.hollow {
    background: transparent;
    color: var(--fg);
    box-shadow: inset 0 0 0 1px var(--fg);
    animation: none;
  }
  @keyframes blink { 50% { background: transparent; color: transparent; } }
  @media (prefers-reduced-motion: reduce) {
    #cursor { animation: none; }
  }

  a { color: var(--arch); }

  /* progress bar cell used by pacman */
  .pbar { color: var(--arch); }

  /* hidden input to summon the mobile keyboard */
  #kb {
    position: fixed; opacity: 0; pointer-events: none;
    left: -9999px; top: 0; width: 1px; height: 1px;
  }

  /* ---- HTML file viewer (a minimal "browser window") ---- */
  #viewer {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(2px);
    padding: clamp(8px, 3vw, 40px);
  }
  #viewer.open { display: grid; place-items: center; }
  .win {
    width: min(1000px, 100%);
    height: min(88vh, 820px);
    display: flex; flex-direction: column;
    background: #0c0d0f;
    border: 1px solid #26292d;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(23,147,209,0.15);
  }
  .win-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    background: #131518;
    border-bottom: 1px solid #26292d;
    font-size: 13px;
  }
  .win-dots { display: flex; gap: 7px; }
  .win-dots i {
    width: 12px; height: 12px; border-radius: 50%; display: inline-block;
  }
  .d1 { background: #ff5f57; } .d2 { background: #febc2e; } .d3 { background: #28c840; }
  .win-url {
    flex: 1; min-width: 0;
    color: #9aa0a6;
    background: #0c0d0f;
    border: 1px solid #26292d;
    border-radius: 6px;
    padding: 4px 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .win-url b { color: var(--arch); font-weight: 500; }
  .win-close {
    color: #cdd0d4; background: transparent; border: 0; cursor: pointer;
    font: inherit; padding: 2px 8px; border-radius: 6px;
  }
  .win-close:hover { background: #26292d; color: #fff; }
  .win iframe { flex: 1; width: 100%; border: 0; background: #fff; }

  /* ---- nano-style editor ---- */
  #editor { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; background: var(--bg); }
  #editor.open { display: flex; }
  .ed-top {
    background: var(--fg); color: var(--bg);
    display: flex; justify-content: space-between; padding: 3px 10px; font-weight: 700;
  }
  #ed-area {
    flex: 1; width: 100%; resize: none; border: 0; outline: 0;
    background: var(--bg); color: var(--fg);
    font-family: var(--mono); font-size: var(--fs); line-height: 1.4;
    padding: 10px 14px;
  }
  .ed-status { text-align: center; color: var(--arch); min-height: 1.2em; padding: 1px 0; }
  .ed-keys { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 24px; padding: 4px 10px 8px; }
  @media (min-width: 720px) { .ed-keys { grid-template-columns: repeat(4, 1fr); } }
  .ed-keys span { white-space: nowrap; }
  .ed-keys b { background: var(--fg); color: var(--bg); padding: 0 3px; font-weight: 700; }

  .hint {
    position: fixed; right: 12px; bottom: 8px; z-index: 5;
    color: #3a3d42; font-size: 12px; pointer-events: none;
    transition: opacity .4s;
  }
</style>

<script type="text/html" id="page-welcome">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
  :root { --arch:#1793d1; --ink:#0c1116; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:var(--ink); background:
         radial-gradient(1200px 500px at 80% -10%, #d7f0ff, transparent 60%),
         linear-gradient(180deg,#f6fbff,#ffffff); min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:64px 28px 80px; }
  .badge { display:inline-flex; align-items:center; gap:8px; font-weight:700; letter-spacing:.06em;
           text-transform:uppercase; font-size:12px; color:var(--arch); }
  .badge svg { width:22px; height:22px; }
  h1 { font-size:clamp(30px,6vw,52px); line-height:1.05; margin:14px 0 8px; letter-spacing:-.02em; }
  h1 span { color:var(--arch); }
  p.lead { font-size:19px; line-height:1.6; color:#3a444d; margin:0 0 28px; }
  .card { background:#fff; border:1px solid #e4edf3; border-radius:14px; padding:22px 24px; margin:14px 0;
          box-shadow:0 10px 30px rgba(23,147,209,.06); }
  .card h2 { margin:0 0 6px; font-size:16px; }
  .card code { background:#eef6fb; color:#0c5a86; padding:2px 7px; border-radius:6px; font-size:14px; }
  .grid { display:grid; gap:14px; grid-template-columns:1fr 1fr; }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }
  footer { margin-top:34px; color:#8a97a1; font-size:13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="#1793d1"><path d="M12 2 L2 21 h20 Z M12 7 l5.5 10.5 c-1.6-.9-3.4-1.6-5.5-1.6 s-3.9.7-5.5 1.6 Z"/></svg>
      Arch Linux WebTTY
    </div>
    <h1>You just opened a <span>real HTML file</span>.</h1>
    <p class="lead">This page was served straight out of the terminal's virtual
      filesystem at <code>~/pages/welcome.html</code> and rendered by the browser —
      exactly like <code>xdg-open</code> would on a real Arch box.</p>
    <div class="grid">
      <div class="card"><h2>Open a file</h2><p><code>open ~/pages/about.html</code> or
        <code>xdg-open welcome.html</code></p></div>
      <div class="card"><h2>Write your own</h2><p><code>nano hello.html</code>, save with
        <code>^O</code>, then <code>open hello.html</code>.</p></div>
      <div class="card"><h2>System info</h2><p>Run <code>fastfetch</code> for the real
        Arch logo and specs.</p></div>
      <div class="card"><h2>Explore</h2><p><code>ls</code>, <code>cd</code>,
        <code>cat</code>, <code>pacman -Q</code>, <code>help</code>.</p></div>
    </div>
    <footer>Arch Linux — a lightweight and flexible Linux® distribution that tries to Keep It Simple.</footer>
  </div>
</body>
</html>
</script>

<script type="text/html" id="page-about">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Arch Linux</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0d1117; color:#c9d1d9;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { padding:56px 28px 40px; text-align:center;
           background:radial-gradient(900px 380px at 50% -30%, rgba(23,147,209,.35), transparent 60%);
           border-bottom:1px solid #21262d; }
  header h1 { font-size:clamp(28px,5vw,44px); margin:12px 0 6px; letter-spacing:-.02em; }
  header h1 b { color:#1793d1; }
  header p { color:#8b949e; max-width:560px; margin:0 auto; line-height:1.6; }
  main { max-width:760px; margin:0 auto; padding:34px 28px 70px; }
  section { border-left:2px solid #1793d1; padding:2px 0 2px 20px; margin:26px 0; }
  section h2 { margin:0 0 6px; font-size:17px; color:#e6edf3; }
  section p { margin:0; line-height:1.7; color:#9fb0c0; }
  .principles { display:grid; gap:12px; grid-template-columns:1fr 1fr; margin:28px 0; }
  @media (max-width:560px){ .principles{ grid-template-columns:1fr; } }
  .principles div { background:#161b22; border:1px solid #21262d; border-radius:12px; padding:16px 18px; }
  .principles b { color:#1793d1; }
  code { background:#161b22; border:1px solid #21262d; padding:1px 6px; border-radius:5px; color:#79c0ff; }
</style>
</head>
<body>
  <header>
    <h1>About <b>Arch Linux</b></h1>
    <p>A general-purpose rolling-release distribution created in 2002, built around
       simplicity, minimalism and user centrality.</p>
  </header>
  <main>
    <div class="principles">
      <div><b>Simplicity</b><br>No unnecessary additions or modifications. Ship software
        as the developers intended.</div>
      <div><b>Modernity</b><br>Rolling releases: the newest stable kernels, toolchains and
        packages, always.</div>
      <div><b>Pragmatism</b><br>Decisions made through debate, not ideology. Whatever works,
        works.</div>
      <div><b>User-centrality</b><br>Arch targets the competent user who is willing to read
        the Wiki and build their system up.</div>
    </div>
    <section><h2>pacman</h2><p>The package manager that binds the system together. Install
      with <code>pacman -S name</code>, upgrade the whole system with <code>pacman -Syu</code>.</p></section>
    <section><h2>The Arch Way</h2><p>You assemble the system yourself from a minimal base,
      so you understand and control every part of it.</p></section>
    <section><h2>The AUR</h2><p>The Arch User Repository: a community-driven collection of
      build scripts (PKGBUILDs) for tens of thousands more packages.</p></section>
  </main>
</body>
</html>
</script>

# Noctalia

Noctalia is a native Wayland desktop shell for people who want a polished, configurable Linux desktop without stitching
together a separate bar, launcher, notification daemon, lock screen, wallpaper tool, and settings UI.

It provides the shell layer around your compositor: bars, widgets, dock, launcher, control center, notifications,
wallpaper, lock screen, session actions, clipboard history, OSDs, tray integration, and desktop widgets. The project is
built directly on Wayland and OpenGL ES with no Qt or GTK dependency, so the UI, rendering, configuration, and IPC model
are designed as one cohesive shell instead of a collection of unrelated panels and scripts.

> [!IMPORTANT]
> Noctalia v5 is currently in Beta. While the core features and architecture are stabilizing, you may still encounter occasional configuration or behavior adjustments as we prepare for the final release.

## Why Noctalia?

Most Wayland setups leave the desktop shell to a stack of small tools: one bar, another launcher, another notification
daemon, a lock screen, a wallpaper daemon, scripts for session actions, and separate config formats for each piece. That
can be flexible, but it also makes a complete desktop feel fragile and hard to keep visually consistent.

Noctalia solves that by providing one configurable shell layer that owns the common desktop surfaces and services while
still fitting into compositor-driven Wayland workflows. It is meant for users who want the control of a custom desktop
environment with fewer moving parts and a consistent UI.

To understand the values and philosophy guiding the project, read our [ethos](https://noctalia.dev/ethos).

## What It Includes

- Multi-monitor bars with configurable widgets, taskbar, workspaces, system tray, media, network, battery, brightness,
  weather, clipboard, and custom script-backed widgets.
- Dock, launcher, control center, notification toasts/history, wallpaper picker, OSD overlays, lock screen, session
  panel, and desktop widgets.
- TOML configuration with hot reload, GUI-managed overrides, theme/palette support, template application, and IPC for
  runtime control.
- Direct Wayland integration for layer-shell, session lock, idle behavior, clipboard, foreign toplevels, workspaces,
  fractional scaling, and compositor-specific workspace backends where needed.

## Wayland Compositor Support

Noctalia supports Wayland compositors that provide the layer-shell protocols it needs for shell surfaces. Workspace
integration works through compositor-native backends where needed, or through `ext-workspace-v1` on compositors that
implement it.

Current compositor integrations include Niri, Hyprland, Sway, Scroll, Mango, Labwc, Triad, dwl, and other compatible
Wayland compositors. Other compositors may run Noctalia but can have reduced workspace, window, output, or
session-action integration depending on the protocols and IPC they expose.

## Scope

Noctalia is a desktop shell, not a full desktop environment. It provides the visual and service layer around your
Wayland compositor: bars, panels, launcher, notifications, dock, lock screen, idle behavior, OSDs, theming, wallpapers,
desktop widgets, and multi-monitor shell surfaces.

Window management, tiling, file management, removable-drive mounting, printers management and screen mirroring/casting
belong to the compositor, dedicated desktop applications, or system services.

Display/login greeter support lives in the separate [Noctalia Greeter](https://github.com/noctalia-dev/noctalia-greeter)
project. Noctalia may integrate with those pieces when useful, but it does not replace them.

The plugin system is available for user-installed extensions. Features that are useful to some users but not essential
to the core shell can live there: extra bar widgets, launcher providers, desktop widgets, panels, shortcuts, background
services, compositor-specific extras, hardware-specific controls, and third-party service integrations.

## Build from source

Source dependencies, distro-specific package commands, build modes, and install layouts live in
[BUILDING.md](BUILDING.md).

## Configuration

A ready-to-use starting config with all defaults is at [example.toml](example.toml). The full configuration reference
lives in the [documentation site](https://docs.noctalia.dev/noctalia/).

## Contributing

Bug reports, fixes, documentation updates, themes, and configuration examples are welcome. For general help and design

# Building Noctalia from source

This guide covers source dependencies, distro-specific package installation, build modes, and install layouts.
For prebuilt packages and other installation methods, see the
[installation documentation](https://docs.noctalia.dev/noctalia/getting-started/installation/).

## Dependencies

### Arch

```sh
sudo pacman -S meson gcc just \
  wayland wayland-protocols \
  libglvnd freetype2 fontconfig \
  cairo pango harfbuzz \
  libxkbcommon glib2 \
  libsecret libsodium \
  sdbus-cpp libpipewire wireplumber polkit \
  pam curl libwebp libjxl libsndfile librsvg \
  libqalculate libxml2 \
  md4c tomlplusplus libical \
  nlohmann-json stb \
  jemalloc
```

### Fedora

```sh
sudo dnf install meson gcc-c++ just \
  wayland-devel wayland-protocols-devel \
  libEGL-devel mesa-libGLES-devel \
  freetype-devel fontconfig-devel \
  cairo-devel pango-devel harfbuzz-devel \
  libxkbcommon-devel glib2-devel \
  libsecret-devel libsodium-devel \
  sdbus-cpp-devel pipewire-devel wireplumber-devel \
  pam-devel polkit-devel libcurl-devel libwebp-devel libjxl-devel libsndfile-devel librsvg2-devel \
  libqalculate-devel libxml2-devel \
  md4c-devel tomlplusplus-devel libical-devel \
  json-devel stb_image_resize2-devel stb_image_write-devel \
  jemalloc-devel
```

### openSUSE Tumbleweed / Slowroll

```sh
sudo zypper install meson gcc-c++ just \
  wayland-devel wayland-protocols-devel \
  Mesa-libEGL-devel Mesa-libGLESv2-devel \
  freetype2-devel fontconfig-devel \
  cairo-devel pango-devel harfbuzz-devel \
  libxkbcommon-devel glib2-devel \
  libsecret-devel libsodium-devel \
  sdbus-cpp-devel pipewire-devel wireplumber-devel \
  pam-devel polkit-devel libcurl-devel libwebp-devel libjxl-devel libsndfile-devel librsvg-devel \
  libqalculate-devel libxml2-devel \
  md4c-devel tomlplusplus-devel libical-devel \
  nlohmann_json-devel stb-devel \
  jemalloc-devel
```

### Debian / Ubuntu

```sh
sudo apt install meson g++ just \
  libwayland-dev wayland-protocols \
  libegl-dev libgles-dev \
  libfreetype-dev libfontconfig-dev \
  libcairo2-dev libpango1.0-dev libharfbuzz-dev \
  libxkbcommon-dev libglib2.0-dev \
  libsecret-1-dev libsodium-dev \
  libsdbus-c++-dev libpipewire-0.3-dev libwireplumber-0.5-dev \
  libpam0g-dev libpolkit-agent-1-dev libpolkit-gobject-1-dev \
  libcurl4-openssl-dev libwebp-dev libjxl-dev libsndfile1-dev librsvg2-dev \
  libqalculate-dev libxml2-dev \
  libmd4c-dev libtomlplusplus-dev libical-dev \
  nlohmann-json3-dev libstb-dev \
  libjemalloc-dev
```

### Void Linux

```sh
sudo xbps-install meson ninja pkg-config git \
  wayland-devel wayland-protocols libepoxy-devel \
  MesaLib-devel libglvnd-devel cairo-devel \
  pango-devel fontconfig-devel freetype-devel \
  harfbuzz-devel libxkbcommon-devel pipewire-devel wireplumber-devel \
  libsecret-devel libsodium-devel \
  libcurl-devel pam-devel libwebp-devel libjxl-devel libsndfile-devel \
  basu-devel sdbus-c++-devel \
  libmd4c-devel tomlplusplus-devel libical-devel \
  json-c++ stb \
  polkit-devel librsvg-devel libqalculate-devel libxml2-devel jemalloc-devel
```

### AerynOS

```sh
sudo moss install meson gcc clang just \
  wayland-devel wayland-protocols-devel \
  libglvnd-devel freetype-devel fontconfig-devel \
  cairo-devel pango-devel harfbuzz-devel \
  libxkbcommon-devel glib2-devel \
  libsecret-devel libsodium-devel \
  sdbus-cpp-devel pipewire-devel wireplumber-devel polkit-devel \
  linux-pam-devel curl libwebp-devel libjxl-devel libsndfile-devel librsvg-devel \
  libqalculate-devel libxml2-devel \
  md4c-devel tomlplusplus-devel libical-devel \
  nlohmann-json stb \
  jemalloc-devel
```

Vendored dependencies, with no system package needed: `Wuffs`,
`Luau`, `fzy`, and Material Color Utilities.

System packages required beyond the Wayland/GL stack: `libwebp` handles WebP decoding and thumbnail encoding,
`libjxl` handles JPEG XL decoding, `libsndfile` decodes shell sound effects (WAV, FLAC, Ogg/Vorbis, Opus, MP3, and
AIFF), and Wuffs handles the other supported raster image formats. `libqalculate` powers
the launcher calculator (arithmetic, unit and currency conversion).

Polkit agent support requires development files that provide the `polkit-agent-1` and `polkit-gobject-1` pkg-config
modules. Some distros ship these in the runtime `polkit` package, while split-package distros use names such as
`polkit-devel`, `polkit-dev`, or `libpolkit-agent-1-dev` / `libpolkit-gobject-1-dev`.

Pipewire libraries/headers are sufficient to build Noctalia, but there is also a runtime requirement for the pipewire
daemon. Noctalia will abort startup if it can't connect to the daemon. If your distro splits the pipewire libraries
and daemon into separate packages, make sure you have both installed.

`upower` is an optional dependency used for battery and power device integration.

`ddcutil` is an optional dependency used for controlling monitor brightness.

Credential and encrypted-state persistence requires a Secret Service provider at runtime, such as GNOME Keyring,
KWallet, or KeePassXC. `libsecret` is the client library and does not provide the session service by itself. Noctalia
continues to run when no provider is available, but features requiring durable secrets cannot persist them.
CalDAV accounts may instead read their password from one explicitly configured regular file, which supports secret
provisioners such as agenix and sops-nix without installing a Secret Service provider. Google refresh tokens and
other writable credentials still require Secret Service. Encrypted state, including clipboard history and the calendar
event cache, may instead read one storage master key from an explicitly configured file.

`jemalloc` is recommended but optional. It reduces memory fragmentation in long-running sessions, and on glibc systems
it is used automatically when detected. Use Meson's `-Djemalloc=enabled` or `-Djemalloc=disabled` option to require or
disable it explicitly.

Sanitizer runtime packages are only needed for ASan/UBSan builds configured with `just configure asan`.

The sources are built as C++23, which requires GCC 13+ or Clang 16+. Current rolling and recent stable distros (Arch,
Fedora 38+, Debian 13, Ubuntu 24.04+) ship a new enough compiler by default. On Debian 12 "bookworm" install `g++-13`
and point Meson at it (e.g. `CXX=g++-13 just configure`).

## Building and installing

Requires [just](https://github.com/casey/just) and [meson](https://mesonbuild.com/).

### Release build

```sh
# Optimized release build in build-release/
just configure release
just build release

# Install the selected build mode. This does not build or reconfigure.
sudo just install release
```

Release builds are portable by default. For a machine-local build, enable native CPU optimizations after configuring:

```sh
meson configure build-release -Dnative_optimizations=true
just build release
```

Pass a prefix to `configure` to install somewhere other than `/usr/local`:

```sh
just configure release "$HOME/.local"
just build release
just install release
```

To remove files installed from a build directory, run `just uninstall release`. The `install` and `uninstall` recipes
require an explicit build mode so debug builds are not installed by accident.

### Debug build

```sh
# Debug build in build-debug/ for local development and troubleshooting.
just configure
just build

# Test your local debug build with
just run
```

Unit tests are not compiled by `just build`, which targets only the Noctalia executable. Build and run them explicitly
with `just test` (use `just test release` to force them on for a release build). Direct Meson users can control test
target generation with the `-Dtests=enabled|disabled|auto` option.
Production sources compile once into an internal static library shared by the shell and test executables.

Meson installs the binary and shipped assets using the normal prefix layout:

```text
/usr/local/bin/noctalia
/usr/local/share/noctalia/assets/...
```

Noctalia needs the shipped `assets/` tree at runtime. Copying only the `noctalia` binary is not enough.

Firefox theming uses the built-in template `post_action = "firefox-theme"` (same pattern as
`kde-color-scheme`) plus the [Pywalfox](https://addons.mozilla.org/en-US/firefox/addon/pywalfox/)
browser extension. Manual host helpers: `noctalia firefox-theme --help`.

Portable bundle layouts are also supported:

```text
bundle/
  noctalia
  assets/
```

```text
bundle/
  bin/noctalia
  share/noctalia/assets/
```

See [CONTRIBUTING.md](CONTRIBUTING.md#runtime-assets) for the full runtime asset lookup order.

</script>
<script type="text/plain" id="noc-packaging">
# Packaging Noctalia

Notes for distribution packagers. End-user install docs live in the
[README](README.md) and at [docs.noctalia.dev](https://docs.noctalia.dev/noctalia/getting-started/installation/).

## Package description

Use this exact short description for package metadata (`pkgdesc`, `Summary`,
AppStream, etc.):

> A sleek, customizable desktop shell crafted for Wayland.

Do not substitute shorter or alternate blurbs (“lightweight Wayland bar”,
“status bar”, ...). Noctalia is a full desktop shell (bars, dock, launcher,
notifications, lock screen, wallpaper, settings, ...), not a bar-only tool.

## Packaged distributions

v5 is already packaged for:

- Arch Linux
- NixOS
- Fedora
- openSUSE
- KaOS
- Gentoo
- Void Linux
- GNU Guix
- Debian (including Ubuntu)

[Repology](https://repology.org/project/noctalia/versions) is a useful at-a-glance
check, but it only covers repositories it indexes (and may still list v4 as
`noctalia-shell`). It is not a complete inventory of community packaging.

## Identity

| | |
|---|---|
| Name | `noctalia` |
| Homepage | https://github.com/noctalia-dev/noctalia |
| Docs | https://docs.noctalia.dev |
| License | MIT ([LICENSE](LICENSE)); also see vendored licenses under `third_party/` for SPDX completeness |
| Version | Meson `project(... version: ...)` in [`meson.build`](meson.build) |
| Binary | `noctalia` |
| Desktop entry | `dev.noctalia.Noctalia.desktop` |
| Icon | `noctalia` (`share/icons/hicolor/scalable/apps/noctalia.svg`) |

## Maintenance Policy

Releases strive to follow [semantic versioning](https://semver.org).
The latest version is the only actively maintained version.
No attempts are made to achieve overlapping lifecycles of major or minor versions.
Bug reports are required to be reproducible on the latest version.

## Architectures / libc

First-class targets:

- `x86_64` (amd64)
- `aarch64` (arm64)

Linux only. There is no intentional arch-specific code path; other little-endian
Linux arches may build if dependencies are available, but they are not
first-class supported.

**musl**: known to build (e.g. Alpine / Void musl). Not first-class tested.
`jemalloc` is glibc-only, on musl leave `-Djemalloc=disabled` (or `auto`, which
skips it).

## Compilers / linkers

C++23 is required.

| Toolchain | Minimum | Notes |
|---|---|---|
| GCC + libstdc++ | **GCC 13+** | Default on most distros |
| Clang + libstdc++ or libc++ | **Clang 16+** | libc++ needs Meson’s experimental-library flags (already wired in `meson.build`) |

Debian 12 “bookworm” needs a newer toolchain than the default `g++` (e.g.
`g++-13` with `CXX=g++-13`).

No special linker is required. The default linker from the compiler driver is
fine (**GNU ld** / gold, **lld**, **mold** via `-fuse-ld=` all work). Release
builds pass `-Wl,--gc-sections` and `-Wl,--as-needed`, which those linkers
support.

## Build

- Build system: [Meson](https://mesonbuild.com/) + Ninja. The repo’s
  [`justfile`](justfile) is convenience only; packaging can call Meson
  directly.
- Language / toolchain: see [Compilers / linkers](#compilers--linkers).
- Recommended: `meson setup build --buildtype=release`, then compile/install.
- Do **not** enable `-Dnative_optimizations=true` for distro packages (CPU-local
  codegen; not portable).
- Tests: `-Dtests=disabled` (or leave `auto`, which skips tests for release).
- `jemalloc`: recommended on glibc; Meson feature option `-Djemalloc=auto|enabled|disabled`.
  Only used on glibc builds.

Prefix/datadir are baked into the binary via `NOCTALIA_INSTALL_PREFIX` /
`NOCTALIA_INSTALL_DATADIR`. Install with the same prefix you configured.

### Installed layout

```text
<prefix>/bin/noctalia
<prefix>/share/noctalia/assets/...
<prefix>/share/applications/dev.noctalia.Noctalia.desktop
<prefix>/share/icons/hicolor/scalable/apps/noctalia.svg
```

The shipped `assets/` tree is **required at runtime**. Shipping only the binary
breaks fonts, translations, templates, glyphs, and sounds. See
[CONTRIBUTING.md](CONTRIBUTING.md#runtime-assets) for lookup order (including
`NOCTALIA_ASSETS_DIR` overrides for unusual layouts).

Not shipped (don’t look for them in the install): AppStream / metainfo XML, man
pages, systemd units.

### Shell completions

Static completion files are not shipped. Generate them from the freshly built
binary and install them in the distribution's completion directories:

```text
./build-<mode>/noctalia completions bash  → share/bash-completion/completions/noctalia
./build-<mode>/noctalia completions zsh   → share/zsh/site-functions/_noctalia
./build-<mode>/noctalia completions fish  → share/fish/vendor_completions.d/noctalia.fish
```

This is intentionally a packaging step rather than a Meson install rule:
executing the target binary during installation would break cross-compilation.

## Dependencies

No Qt or GTK. UI is Wayland + OpenGL ES (EGL/GLES, or `libepoxy` as a fallback
when separate EGL/GLES packages are missing).

### Build-time (required)

Canonical list is the `dependency(...)` / header checks in
[`meson.build`](meson.build). Distro package names differ; [BUILDING.md](BUILDING.md)
has copy-paste install lines for common distros.

Notes packagers hit often:

- **stb** must provide `stb/stb_image_resize2.h` (and `stb/stb_image_write.h`).
  Older packages that only ship `stb_image_resize` are not enough. Meson fails
  the configure check if `stb_image_resize2` is missing.
- Meson requires **WirePlumber 0.5** (`wireplumber-0.5` pkg-config). 0.4 is not
  enough.

### Vendored (no system package)

Shipped under `third_party/`: Wuffs, Luau, fzy, Material Color Utilities.
Each carries its own license file beside the code.

### Runtime

| Dependency | Role |
|---|---|
| PipeWire **daemon** (+ WirePlumber 0.5) | Audio, volume OSD, privacy indicators, spectrum. Libraries alone are not enough; without a running daemon those features stay off. |
| PAM (`login` service by default) | Lock screen authentication |
| Fontconfig / fonts | Text rendering (users still need usable fonts installed) |
| `git` | Plugin git sources / auto-update invoke `git` on `PATH` |
| `upower` | Optional: battery / power devices |
| `ddcutil` | Optional: external monitor brightness |
| Secret Service provider | Optional but recommended for credential / encrypted-state persistence (GNOME Keyring, KWallet, KeePassXC, ...). `libsecret` is only the client library; without a session provider those features cannot persist secrets. |

## Startup and IPC

No systemd user unit is shipped. Typical startup is compositor autostart or the
desktop entry (`noctalia --daemon`). Control a running instance with
`noctalia msg ...` (Unix socket under `XDG_RUNTIME_DIR`).

Keep the `.desktop` daemon Exec unless you intentionally package a different
session integration. Prefer the canonical description above for `Comment=` /
AppStream summary as well.

## Session conflicts

On non-Plasma sessions Noctalia provides and registers:

- `org.freedesktop.Notifications`
- `org.kde.StatusNotifierWatcher` (system tray host)

Do not run it alongside another notification daemon or StatusNotifier host
(mako, dunst, swaync, waybar-as-host, ...) unless those are disabled. On Plasma,
Noctalia integrates with Plasma's notification / tray paths instead of claiming
the freedesktop Notifications name.

## User data paths

| Kind | Default |
|---|---|
| Config | `$XDG_CONFIG_HOME/noctalia` (`~/.config/noctalia`), e.g. `config.toml` |
| State | `$XDG_STATE_HOME/noctalia` (`~/.local/state/noctalia`), e.g. `settings.toml`, caches |
| Data | `$XDG_DATA_HOME/noctalia` (`~/.local/share/noctalia`) |
| Logs | `$XDG_CACHE_HOME/noctalia` (`~/.cache/noctalia`) |

Override bases with `NOCTALIA_CONFIG_HOME`, `NOCTALIA_STATE_HOME`,
`NOCTALIA_DATA_HOME` (each still appends `/noctalia`).

## What Noctalia is not

- Not a compositor, display manager, or greeter. Greeter support is
  [noctalia-greeter](https://github.com/noctalia-dev/noctalia-greeter).
- Not a replacement for file managers, screen casting, or drive mounting.
- Compositor support varies (protocols / IPC). See the compositor docs for
  [Niri](https://docs.noctalia.dev/noctalia/compositor-settings/niri/),
  [Hyprland](https://docs.noctalia.dev/noctalia/compositor-settings/hyprland/),
  [Sway / Scroll](https://docs.noctalia.dev/noctalia/compositor-settings/sway-scroll/),
  [Mango](https://docs.noctalia.dev/noctalia/compositor-settings/mango/),
  [Labwc](https://docs.noctalia.dev/noctalia/compositor-settings/labwc/), and
  [KDE Plasma](https://docs.noctalia.dev/noctalia/compositor-settings/kde/).

## Versioning and beta

v5 is currently beta. Prefer packaging **tagged releases** rather than random
`main` snapshots unless you maintain a `-git` / nightly package on purpose.

## Contact

- Issues: https://github.com/noctalia-dev/noctalia/issues
- Discord: https://discord.noctalia.dev

<script type="text/plain" id="noc-config">
# Noctalia configuration — all settings at their defaults.
# Copy to ~/.config/noctalia/config.toml and edit what you need.
# Most changes are hot-reloaded via inotify; startup-only settings are noted inline.

# ── Shell ─────────────────────────────────────────────────────────────────────

[accessibility]
ui_scale              = 1.0
high_contrast         = false

[shell]
corner_radius_scale   = 1.0          # 0 = square, 1 = default, 2 = extra rounded
font_family           = "sans-serif"
time_format           = "{:%H:%M}"  # default shell UI time format
date_format           = "%A, %x"    # default shell UI date format
offline_mode          = false        # block all outgoing HTTP when true
# panel_anchor_bar   = "main"        # bar panels attach to without a source bar; omit = first enabled bar
telemetry_enabled     = false        # send an anonymous startup ping
niri_overview_type_to_launch_enabled = false # opt in to type-to-launch from niri overview
polkit_agent          = false
password_style        = "default"    # default | random
settings_show_advanced = true        # show advanced settings by default in Settings
# settings_window_translucent = false  # translucent settings window background
show_location         = true         # hide weather location text in shell UI when false
# app_icon_colorize   = false        # recolor application icons across the shell
# app_icon_color      = "on_surface" # ColorSpec role or #hex when colorize is enabled
clipboard_enabled     = true         # false disables clipboard panel, history, and compositor clipboard hooks
clipboard_history_max_entries = 100 # unpinned history cap (10–10000); pinned entries are extra
# A Wayland selection is served by the app that owns it, so it dies when that app exits.
# With this on, the shell claims it back so the item stays pasteable. Caveat: a password
# manager that clears the clipboard by exiting looks identical to any other app closing,
# so its secret can be kept alive too. Apps advertising x-kde-passwordManagerHint are
# already excluded; set this to false if you rely on one that does not.
clipboard_keep_from_closed_apps = true # keep the last copied item pasteable after the app you copied it from closes
clipboard_auto_paste  = "auto"       # off | auto | ctrl_v | ctrl_shift_v | shift_insert
clipboard_image_action_command = ""  # image preview action: gimp {path}, or satty -f - via stdin
# IPC example:
# noctalia msg clipboard-clear
shared_gl_context     = true         # startup-only; false isolates GPU contexts for broken drivers
# lang                = "en"
# avatar_path         = "~/Pictures/avatar.png"

[shell.privacy]
mic_filter_regex = ""                # microphone app names to ignore in privacy indicators and OSD
cam_filter_regex = ""                # camera app names to ignore in privacy indicators and OSD
screen_filter_regex = ""             # screen-sharing app names to ignore in privacy indicators and OSD

[shell.animation]
enabled = true
speed   = 1.0                       # 0.5 = 2× slower, 2.0 = 2× faster

[shell.shadow]
direction = "down"                  # center, up, down, left, right, up_left, up_right, down_left, down_right
alpha     = 0.55                    # multiplied by each component's background opacity

[shell.panel]
transparency_mode     = "solid"     # solid | soft | glass; controls floating-panel opacity and card translucency
borders               = true        # panel shell outline and in-panel section cards
shadow                = true        # cast the global [shell.shadow] from panel surfaces
launcher_placement       = "floating" # attached | floating
clipboard_placement      = "floating" # attached | floating
control_center_placement = "attached" # attached | floating
wallpaper_placement      = "attached" # attached | floating
session_placement        = "attached" # attached | floating
launcher_position        = "center"   # auto | center | top_left | … (floating only)
clipboard_position       = "center"   # auto | center | top_left | … (floating only)
open_near_click_control_center = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_launcher       = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_clipboard      = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_wallpaper      = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_session        = false # for attached/floating placement, follow the bar click instead of bar-center

[shell.launcher]
categories    = true                    # show category filters in the launcher
show_icons    = true                    # show application icons in launcher results
show_app_origin_indicator = true        # show package origin indicators on application results
compact       = false                   # use smaller icons and tighter result rows
app_grid      = false                   # show app icon grid view when results are apps only
sort_by_usage = true                    # sort apps by usage frequency
pinned        = []                      # e.g. ["firefox", "code", "kitty"] (launcher only)
fetch_exchange_rates = true             # refresh currency rates from third-party sources
provider_prefix = "/"                     # common prefix character for provider trigger words (e.g. "/" or ".")
auto_paste = "auto"                       # off | auto | ctrl_v | ctrl_shift_v | shift_insert (copy activations)

# For each provider: prefix = trigger word (empty falls back to its built-in default; triggers on
# provider_prefix + trigger, e.g. "/emo"). global = true also surfaces it in unprefixed search.
[shell.launcher.providers.calculator]
prefix = "calc"
global = true                           # also show calculator results in unprefixed search

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
prefix = "session"
global = false                          # set true to include session actions in unprefixed search

[shell.launcher.providers.wallpaper]
prefix = "wall"

[shell.launcher.providers.windows]
prefix = "win"

[shell.mpris]
blacklist = []                      # ignore MPRIS players by bus/identity/desktop entry token

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled             = true
fill_mode           = "crop"        # center | crop | fit | stretch | repeat | span
fill_color          = ""            # optional fallback/fill color: prefer a color role token; fixed hex also works
transition          = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_duration = 1500          # milliseconds
edge_smoothness     = 0.3
transition_on_startup = false       # animate the first wallpaper at shell startup (v4-style)
directory           = "~/Pictures/Wallpapers"
directory_light     = ""            # optional day-mode directory
directory_dark      = ""            # optional night-mode directory

[wallpaper.default]
path = ""                            # optional initial/default wallpaper path

[wallpaper.automation]
enabled                    = false
interval_seconds           = 1800    # seconds between changes
order                      = "random" # random | alphabetical
recursive                  = true    # include subdirectories when picking random wallpapers

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode   = "dark"                     # dark | light | auto
source = "builtin"                  # builtin | wallpaper | community
builtin = "Noctalia"                # Ayu | Catppuccin | Dracula | Eldritch | Gruvbox |
                                    # Kanagawa | Noctalia | Nord | Rosé Pine | Tokyo-Night
# community_palette = "Noctalia"    # fetched from api.noctalia.dev, cached locally
# wallpaper_scheme  = "m3-content"  # m3-tonal-spot | m3-content | m3-fruit-salad |
                                    # m3-rainbow | m3-monochrome | vibrant | faithful |
                                    # dysfunctional | muted
pure_black_dark = false             # anchor dark surfaces to true black (OLED); applies to
                                    # every palette source, not just wallpaper-generated ones

[theme.templates]
enable_builtin_templates            = true
builtin_ids                = []     # opt-in; list ids with: noctalia theme --list-templates
enable_community_templates = true
community_ids              = []     # fetched from api.noctalia.dev/templates, cached locally

# User-defined templates are declared directly in config.
# [theme.templates.user.my_app]
# input_path  = "templates/my-app.css"
# output_path = "~/.config/my-app/theme.css"
# post_hook   = "my-app --reload-theme"

# ── Backdrop ──────────────────────────────────────────────────────────────────

[backdrop]
enabled                = false
blur_intensity         = 0.5        # 0.0 = no blur, 1.0 = maximum
tint_intensity         = 0.3        # 0.0 = no tint, 1.0 = opaque

# ── Notifications ─────────────────────────────────────────────────────────────

[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true           # show action buttons; when false, clicking a toast triggers its default action
layer              = "top"          # top | overlay
scale              = 1.0            # notification size multiplier applied on top of accessibility.ui_scale
background_opacity = 0.97
offset_x           = 20             # absolute horizontal margin from the screen edge
offset_y           = 8              # absolute vertical margin from the screen edge
# [notification.filter.rhythmbox]
# enabled         = true
# match           = "rhythmbox"
# show_toast      = true
# save_history    = false
# play_sound      = true
# bypass_dnd      = false            # bypass DND for matching notifications; play_sound still controls sound
# allowed_urgencies = ["normal", "critical"]  # omit or list all three to allow every level
# IPC examples:
# noctalia msg notification-invoke-latest
# noctalia msg notification-clear-active
# noctalia msg notification-clear-history

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
position = "top_right"              # top_right | top_left | top_center | bottom_right | bottom_left | bottom_center | center_right | center_left
position_vertical = "top_center"    # same options; used when orientation = "vertical"
orientation = "horizontal"          # horizontal | vertical (volume/brightness sliders only; text popups stay horizontal)
scale = 1.0                         # OSD size multiplier applied on top of accessibility.ui_scale
background_opacity = 0.97           # background opacity of OSD popups
offset_x = 20                       # absolute horizontal margin from the screen edge
offset_y = 8                        # absolute vertical margin from the screen edge
# monitors = ["DP-1"]               # connector names; omit or leave empty for all monitors

[osd.kinds]
volume = true                       # master volume OSD toggle
volume_output = true                # output (speaker) volume; requires volume = true
volume_input = true                 # input (microphone) volume; requires volume = true
brightness = true                   # display brightness changes
wifi = true                         # Wi-Fi toggle
bluetooth = true                    # Bluetooth toggle
power_profile = true                # power profile changes
caffeine = true                     # idle inhibitor (caffeine) toggle
nightlight = true                   # night light toggle
dnd = true                          # Do Not Disturb toggle
lock_keys = true                    # Caps/Num/Scroll Lock changes; disable to stop polling when no widget uses them
keyboard_layout = true              # input keyboard layout changes
privacy = true                      # microphone/camera/screen-share capture changes

# ── Lock Screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled                 = true
blurred_desktop         = false       # use a desktop snapshot as the lock screen background (requires wlr-screencopy)
blur_intensity          = 0.5         # lock screen background blur (0.0 = none, 1.0 = maximum)
tint_intensity          = 0.3         # surface-color tint over the lock screen background
# wallpaper             = ""          # optional image path for the lock screen; empty uses the desktop wallpaper
# monitors              = ["DP-1"]    # connectors that show the lock screen; empty shows all monitors, others stay black

# ── System Monitor ────────────────────────────────────────────────────────────

[system.monitor]
enabled = true                      # sample CPU, memory, network, load, temperature, GPU VRAM, and disk statistics
cpu_poll_seconds = 2.0              # CPU usage, CPU temperature, and load average
cpu_freq_activity_threshold = 2.5   # GHz; value tint starts when CPU clock crosses this
cpu_freq_critical_threshold = 4.5   # GHz; full highlight at/above this
gpu_poll_seconds = 5.0              # GPU temperature and VRAM usage
memory_poll_seconds = 2.0           # RAM usage
network_poll_seconds = 3.0          # network throughput
disk_poll_seconds = 10.0            # disk usage and swap usage; graph widgets use the fastest poll above

# ── Calendar ──────────────────────────────────────────────────────────────────

[calendar]
enabled                     = false
refresh_minutes             = 15

# Calendar tab of the control center.

[control_center.calendar]
show_events_card            = true
show_week_numbers           = false         # ISO 8601 week numbers in the month grid
event_date_format           = "%A %e %B"    # date format used for events
event_time_format           = "%H:%M"       # time format used for events

# ── Weather ───────────────────────────────────────────────────────────────────

[weather]
enabled         = false
refresh_minutes = 30
unit            = "celsius"         # celsius | fahrenheit
effects         = true              # visual weather effects
# Weather uses the coordinates resolved by [location] (see below).

# ── Audio ─────────────────────────────────────────────────────────────────────

[audio]
enable_overdrive = false            # allow volume above 100% (up to 150%)
enable_sounds = false               # master toggle for UI feedback sounds
sound_volume = 0.5                  # 0.0 - 1.0
volume_change_sound = ""            # empty = bundled sounds/volume-change.wav
notification_sound = ""             # empty = bundled sounds/notification.wav

# ── Brightness ────────────────────────────────────────────────────────────────

[brightness]
enable_ddcutil = false
# ignore_mmids = []                 # skip these monitors from ddcutil; run: ddcutil --verbose detect
# minimum_brightness = 0.0          # never let brightness drop below this floor (0.0 to 1.0)

# Per-monitor backend override:
# [brightness.monitor.eDP-1]
# backend = "backlight"             # auto | none | backlight | ddcutil
# backlight_device = "intel_backlight"  # explicit sysfs device name or path; run: noctalia msg brightness-list-backlight-devices
# [brightness.monitor.DP-1]
# backend = "ddcutil"

# ── Night Light ───────────────────────────────────────────────────────────────

[nightlight]
enabled              = false
force                = false
temperature_day      = 6500         # Kelvin
temperature_night    = 4000         # Kelvin

# ── Location ──────────────────────────────────────────────────────────────────
# Single source of "where am I"; feeds Weather, Night Light, and Theme auto mode.

[location]
auto_locate      = false             # resolve coordinates from IP when true
address          = ""                # e.g. "Toronto, ON"; geocoded when auto_locate = false
# latitude       = 52.5200           # manual coordinates, used when auto_locate and address are off
# longitude      = 13.4050
# custom_schedule = true    # schedule day/night from the times below instead of coordinates
# sunset         = "20:30"           # HH:MM — night start
# sunrise        = "07:30"           # HH:MM — day start

# ── Idle ──────────────────────────────────────────────────────────────────────

# Optional `[idle]` keys:
#   pre_action_fade_seconds — fade a fullscreen surface-color overlay in over this many seconds, then run `command`.
#                             Use 0 for immediate commands with no overlay. Input during the fade cancels.
# [idle]
# pre_action_fade_seconds = 2.0

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = false

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = false

# ── Keybinds ──────────────────────────────────────────────────────────────────

[keybinds]
validate = ["return", "kp_enter", "space"]
cancel   = ["escape"]
left     = ["left"]
right    = ["right"]
up       = ["up"]
down     = ["down"]
tab_next = ["tab"]
tab_previous = ["shift+iso_left_tab"]
delete   = ["del"]

# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.main]
position           = "top"          # top | bottom | left | right
thickness          = 34
background_opacity = 1.0
radius             = 12
margin_ends        = 180
margin_edge        = 10
padding            = 14
widget_spacing     = 6
scale              = 1.0
shadow             = true
auto_hide          = false
# smart_auto_hide    = false       # show when the active workspace is empty; hide when it has windows
# show_on_workspace_switch = true   # with auto_hide: briefly reveal when the active workspace changes
reserve_space      = true
capsule            = false
# capsule_fill     = "surface_variant"
# capsule_radius   = 8.0            # omit/blank in Settings for automatic pill radius; 0.0 = square
# capsule_opacity  = 1.0
# capsule_border   = "outline"      # uncomment for a border on all widgets

start  = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end    = ["media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

# Commands for the bar margin outside widget sections (dead zone):
# [bar.main.dead_zone.actions]
# left = "panel-toggle launcher"
# right = "panel-toggle control-center"
# middle = "none"
# scroll_up = "none"
# scroll_down = "none"

# Per-monitor override example — only the fields you list are overridden:
# [bar.main.monitor.dp1]
# match     = "DP-1"
# thickness = 44
# [bar.main.monitor.dp1.dead_zone.actions]
# left = "panel-toggle launcher"

# ── Dock ──────────────────────────────────────────────────────────────────────

[dock]
enabled             = false         # set true to activate
position            = "bottom"      # top | bottom | left | right
icon_size           = 48
main_axis_padding   = 16
cross_axis_padding  = 8
item_spacing        = 6
background_opacity  = 0.88
radius              = 16
radius_top_left     = 16
radius_top_right    = 16
radius_bottom_left  = 16
radius_bottom_right = 16
margin_ends         = 0
margin_edge         = 8
shadow              = true
show_running        = true
auto_hide           = false
# smart_auto_hide   = false       # show when the active workspace is empty; hide when it has windows
reserve_space       = true
layer               = "top"         # top | overlay
active_scale        = 1.0
inactive_scale      = 0.85
magnification       = true
magnification_scale = 1.45
active_opacity      = 1.0
inactive_opacity    = 0.85
show_dots           = false
show_instance_count = true
launcher_position   = "none"       # none | start | end
launcher_icon       = "grid-dots"  # Tabler glyph name
active_monitor_only = false
pinned              = []            # e.g. ["firefox", "code", "kitty"]

# ── Desktop Widgets ───────────────────────────────────────────────────────────

[desktop_widgets]
enabled = false
# When set, widget_order is the active widget list and stacking order.
# widget_order = ["clock_main"]

# [desktop_widgets.grid]
# visible        = true
# cell_size      = 16
# major_interval        = 4
# center_guides_visible = false
# snap_to_center        = true

# [desktop_widgets.widget.clock_main]
# type     = "clock"
# output   = "DP-1"
# cx       = 960.0
# cy       = 540.0
# scale    = 1.5
# rotation = 0.0

# [desktop_widgets.widget.clock_main.settings]
# format = "{:%H:%M}"
# background_opacity = 0.8

# [lockscreen_widgets]
# enabled = false
# widget_order = ["clock_main"]

# [lockscreen_widgets.widget.clock_main]
# type     = "clock"
# output   = "DP-1"
# cx       = 1600.0
# cy       = 120.0
# scale    = 1.5
# rotation = 0.0

# [lockscreen_widgets.widget.clock_main.settings]
# format = "{:%H:%M}"
# background_opacity = 0.8

# ── Control Center ────────────────────────────────────────────────────────────

# Shortcut buttons shown on the right side of the dashboard (up to 6).
# [[control_center.shortcuts]]
# type = "wifi"
# [[control_center.shortcuts]]
# type = "bluetooth"
# [[control_center.shortcuts]]
# type = "nightlight"
# [[control_center.shortcuts]]
# type = "notification"
# [[control_center.shortcuts]]
# type = "wallpaper"
# [[control_center.shortcuts]]
# type = "screen_recorder"
# [[control_center.shortcuts]]
# type = "session"

# ── Hooks ─────────────────────────────────────────────────────────────────────

[hooks]

# started           = "notify-send 'Noctalia' 'Shell started'"
# wallpaper_changed = []
# colors_changed    = []
# theme_mode_changed = "notify-send 'Noctalia' \"Theme mode: $NOCTALIA_THEME_MODE\""
# session_locked    = []
# session_unlocked  = []
# logging_out       = []
# rebooting         = []
# shutting_down     = []
# wifi_enabled      = []
# wifi_disabled     = []
# bluetooth_enabled  = []
# bluetooth_disabled = []
# battery_state_changed   = "notify-send 'Power' \"Battery: $NOCTALIA_BATTERY_STATE\""
# battery_under_threshold = "notify-send 'Power' \"Battery at ${NOCTALIA_BATTERY_PERCENT}%\""
# power_profile_changed   = "notify-send 'Power' \"Profile: $NOCTALIA_POWER_PROFILE\""
# [widget.launcher]
# custom_image = "/path/to/image.png"
# custom_image_colorize = false

# [widget.control-center]
# custom_image = "/path/to/image.png"
# custom_image_colorize = false

# [widget.notifications]
# hide_when_no_unread = true

# [widget.network_rx]
# network_speed_unit = "mb"          # auto | kb | mb
# network_speed_compact = true       # show "1.2M" instead of "1.2 MB/s"
#
# [widget.network_tx]
# network_speed_unit = "mb"          # auto | kb | mb
# network_speed_compact = true       # show "1.2M" instead of "1.2 MB/s"

# [widget.network]
# vpn_status     = "replace"         # replace | both | hidden
# show_label     = true
# show_vpn_label = false             # replace: replaces network label; both: adds VPN label

# [widget.volume.effects_profile_glyphs]
# eq_desktop = "device-speaker"

# [widget.keyboard_layout]
# display                 = "short"    # "short" (e.g. "DE") or "full" (full layout name)
# show_icon               = true
# show_label              = true
# hide_when_single_layout = false      # hide the widget when only one layout is configured
# cycle_command           = ""         # custom command to cycle layouts (empty = compositor backend)
# [widget.keyboard_layout.custom_labels]  # override display labels by exact layout name
# "German (Neo 2)"        = "Neo2"
# "English (US)"          = "EN"

# [widget.lock_button]
# type                = "custom_button"
# glyph               = "lock"
# tooltip             = "Lock screen"
# command             = "noctalia msg session lock"
# right_command       = ""
# middle_command      = ""
# scroll_up_command   = ""
# scroll_down_command = ""
#
# [widget.clock]
# format = "{:%H:%M}\n{:%d/%m}"
# vertical_format = "{:%H\n%M}"
# tooltip_format = "{:%A, %B %d, %Y}"
# scale = 1.0                         # multiplies the bar scale for this widget only
# font_weight = 700
# interactive = false                 # pass clicks/scrolls through to the bar and disable hover/tooltips

<script type="text/plain" id="noc-meson">
project('noctalia', ['c', 'cpp'],
  version: '5.0.0',
  default_options: [

<script type="text/plain" id="games-css">
/* GGR game catalog — flat, borders not glows, no gradients.
 * Loaded by index.html for the deployed site; an inline copy is used as a
 * fallback when this file can't be fetched (e.g. a single-file preview). */

#ggr {
  --bg: #0d0f14;
  --panel: #161922;
  --line: #242835;
  --fg: #e8eaf0;
  --mut: #8b91a3;
  --acc: #4f8cff;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg);
  color: var(--fg);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: none;
  flex-direction: column;
}
#ggr.open { display: flex; }

#ggr .top {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 13px 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
#ggr .brand { display: flex; align-items: baseline; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: .04em; }
#ggr .brand .sub { font-size: 12px; font-weight: 500; color: var(--mut); letter-spacing: 0; }
#ggr .gsearch { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 9px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; color: var(--mut); }
#ggr .gsearch svg { width: 18px; height: 18px; flex: 0 0 auto; }
#ggr .gsearch input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--fg); font: inherit; font-size: 14px; }
#ggr .gsearch:focus-within { border-color: var(--acc); }
#ggr .count { margin-left: auto; color: var(--mut); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#ggr .xbtn { background: var(--panel); border: 1px solid var(--line); color: var(--fg); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
#ggr .xbtn:hover { background: var(--line); }
#ggr .xbtn svg { width: 18px; height: 18px; }

#ggr .body { flex: 1; overflow-y: auto; padding: 18px 20px 64px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
#ggr .sect { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); margin: 28px 2px 13px; }
#ggr .sect:first-child { margin-top: 4px; }
#ggr .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 14px; }

#ggr .gcard {
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  content-visibility: auto;          /* keep 6000+ tiles smooth */
  contain-intrinsic-size: 0 170px;
}
#ggr .gcard .ic { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
#ggr .gcard .ic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
#ggr .gcard .ph { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 26px; color: var(--mut); user-select: none; }
#ggr .gcard .nm { font-size: 12px; line-height: 1.3; color: var(--fg); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#ggr .gcard:hover .ic { border-color: var(--acc); }
#ggr .gcard:hover .nm { color: #fff; }

#ggr .ugs .gcard .ic { display: grid; place-items: center; padding: 8px; }
#ggr .ugs .gcard .ph { position: static; font-size: 13px; font-weight: 600; color: var(--fg); line-height: 1.25; text-align: center; }

#ggr .empty { color: var(--mut); text-align: center; padding: 80px 20px; font-size: 14px; }
#ggr .loading { position: absolute; inset: 55px 0 0; display: grid; place-items: center; color: var(--mut); font-size: 14px; text-align: center; }
#ggr .spin { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--acc); border-radius: 50%; animation: ggrspin .8s linear infinite; margin: 0 auto 12px; }
@keyframes ggrspin { to { transform: rotate(360deg); } }

/* in-catalog game player */
#ggr .player { position: absolute; inset: 0; z-index: 10; background: #000; display: none; flex-direction: column; }
#ggr .player.show { display: flex; }
#ggr .pbar { display: flex; align-items: center; gap: 14px; padding: 9px 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
#ggr .pbar .back, #ggr .pbar .full { display: flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); padding: 7px 13px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; }
#ggr .pbar .back:hover, #ggr .pbar .full:hover { background: var(--line); }
#ggr .pbar .back svg { width: 16px; height: 16px; }
#ggr .pbar .full { margin-left: auto; }
#ggr .pbar .ptitle { font-weight: 600; font-size: 14px; }
#ggr .player iframe { flex: 1; width: 100%; border: 0; background: #000; }
#ggr .pnote { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); color: var(--mut); font-size: 13px; text-align: center; max-width: 520px; line-height: 1.6; padding: 0 20px; }

@media (prefers-reduced-motion: reduce) { #ggr * { animation: none !important; } }

</script>

<script>
(function () {
  "use strict";

  // ======================================================================
  //  Exact fastfetch Arch logo (src/logo/ascii/a/arch.txt, dev branch).
  //  $1 and $2 are the two color slots; the builtin table assigns both to
  //  FF_COLOR_FG_CYAN, so the whole logo renders in the iconic Arch cyan.
  // ======================================================================
  const ARCH_LOGO = [
    '                  -`',
    '                 .o+`',
    '                `ooo/',
    '               `+oooo:',
    '              `+oooooo:',
    '              -+oooooo+:',
    '            `/:-:++oooo+:',
    '           `/++++/+++++++:',
    '          `/++++++++++++++:',
    '         `/+++o$2oooooooo$1oooo/`',
    '        ./$2ooosssso++osssssso$1+`',
    '$2       .oossssso-````/ossssss+`',
    '      -osssssso.      :ssssssso.',
    '     :osssssss/        osssso+++.',
    '    /ossssssss/        +ssssooo/-',
    '  `/ossssso+/:-        -:/+osssso+-',
    ' `+sso+:-`                 `.-/+oso:',
    '`++:.                           `-/+/',
    '.`                                 `/'
  ].join('\n');

  // ---- small helpers ----------------------------------------------------
  const $ = (s) => document.querySelector(s);
  const screen = $("#screen");
  const kb = $("#kb");
  const esc = (s) =>
    String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pad = (s, n) => (s + " ".repeat(Math.max(0, n - s.length)));
  const rint = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

  const HOST = "archlinux";
  const USER = "arch";
  const KVER = "6.10.6-arch1-1";
  const BOOT_TS = Date.now();

  // ======================================================================
  //  Virtual filesystem
  // ======================================================================
  function dir(children) { return { type: "dir", children: children || {} }; }
  function file(content, extra) { return Object.assign({ type: "file", content: content }, extra || {}); }
  function htmlFile(srcId) {
    const el = document.getElementById(srcId);
    const src = el ? el.textContent.replace(/^\n/, "") : "<!doctype html><title>empty</title>";
    return { type: "file", content: src, html: true };
  }
  // read an embedded text/plain asset block by id (real bundled repo files)
  function bundled(id) {
    const el = document.getElementById(id);
    return el ? el.textContent.replace(/^\n/, "").replace(/\n$/, "") + "\n" : "";
  }

  const OS_RELEASE = [
    'NAME="Arch Linux"',
    'PRETTY_NAME="Arch Linux"',
    'ID=arch',
    'BUILD_ID=rolling',
    'ANSI_COLOR="38;2;23;147;209"',
    'HOME_URL="https://archlinux.org/"',
    'DOCUMENTATION_URL="https://wiki.archlinux.org/"',
    'SUPPORT_URL="https://bbs.archlinux.org/"',
    'BUG_REPORT_URL="https://gitlab.archlinux.org/groups/archlinux/-/issues"',
    'LOGO=archlinux-logo'
  ].join("\n") + "\n";

  const BASHRC = [
    '#',
    '# ~/.bashrc',
    '#',
    '',
    '# If not running interactively, don\'t do anything',
    '[[ $- != *i* ]] && return',
    '',
    'alias ls=\'ls --color=auto\'',
    'alias grep=\'grep --color=auto\'',
    'alias ll=\'ls -lah\'',
    'alias ..=\'cd ..\'',
    'PS1=\'[\\u@\\h \\W]\\$ \'',
    '',
    '# greet on login',
    'fastfetch',
    ''
  ].join("\n");

  let root = dir({
    home: dir({
      arch: dir({
        "pages": dir({
          "welcome.html": htmlFile("page-welcome"),
          "about.html": htmlFile("page-about"),
        }),
        "Documents": dir({
          "todo.txt": file("[ ] read the Arch Wiki, cover to cover\n[ ] rice the desktop\n[x] install Arch (btw)\n"),
        }),
        "Downloads": dir({}),
        "Pictures": dir({}),
        ".bashrc": file(BASHRC),
        ".bash_history": file("fastfetch\npacman -Syu\nls\n"),
        "readme.md": file(
          "# Arch Linux WebTTY\n\n" +
          "A faithful in-browser Arch console.\n\n" +
          "Try:\n" +
          "  fastfetch            real logo + specs\n" +
          "  pacman -Syu          full system upgrade\n" +
          "  open pages/welcome.html\n" +
          "  nano hello.html      then: open hello.html\n" +
          "  help                 list every command\n"
        ),
      }),
    }),
    etc: dir({
      "os-release": file(OS_RELEASE),
      "hostname": file(HOST + "\n"),
      "shells": file("/bin/sh\n/bin/bash\n/usr/bin/bash\n/bin/zsh\n"),
      "pacman.conf": file(
        "[options]\nHoldPkg     = pacman glibc\nArchitecture = auto\nColor\nParallelDownloads = 5\n\n" +
        "[core]\nInclude = /etc/pacman.d/mirrorlist\n\n" +
        "[extra]\nInclude = /etc/pacman.d/mirrorlist\n"
      ),
    }),
    usr: dir({ bin: dir({}), share: dir({}), lib: dir({}) }),
    var: dir({ log: dir({}), cache: dir({}) }),
    proc: dir({}),
    tmp: dir({}),
    root: dir({}),
  });

  let cwd = ["home", "arch"];

  // resolve an array/string path to a node; returns {node,parent,name,path} or null
  function pathParts(p) {
    let parts;
    if (p === "~") parts = ("/home/" + USER).split("/");
    else if (p.startsWith("~/")) parts = ("/home/" + USER + "/" + p.slice(2)).split("/");
    else if (p.startsWith("/")) parts = p.split("/");
    else parts = ("/" + cwd.join("/") + "/" + p).split("/");
    const out = [];
    for (const seg of parts) {
      if (seg === "" || seg === ".") continue;
      if (seg === "..") out.pop();
      else out.push(seg);
    }
    return out;
  }
  function nodeAt(parts) {
    let node = root;
    for (const seg of parts) {
      if (!node || node.type !== "dir" || !node.children[seg]) return null;
      node = node.children[seg];
    }
    return node;
  }
  function resolve(p) {
    const parts = pathParts(p);
    return { node: nodeAt(parts), parts };
  }
  function parentOf(parts) {
    return nodeAt(parts.slice(0, -1));
  }
  function displayPath(parts) {
    const home = ["home", USER];
    if (parts.length >= 2 && parts[0] === "home" && parts[1] === USER) {
      const rest = parts.slice(2);
      return "~" + (rest.length ? "/" + rest.join("/") : "");
    }
    return "/" + parts.join("/");
  }

  // ======================================================================
  //  Output primitives
  // ======================================================================
  let inputLine = null; // active prompt element
  // When CAPTURE is a non-null array, printed lines are collected as plain text
  // instead of drawn to the screen. Powers shell $(...), pipes, and program stdout.
  let CAPTURE = null;

  function scrollDown() { screen.scrollTop = screen.scrollHeight; }

  function stripTags(html) {
    const d = document.createElement("div");
    d.innerHTML = html;
    return d.textContent || "";
  }

  function out(html) {
    if (CAPTURE) { CAPTURE.push(stripTags(html)); return null; }
    const div = document.createElement("div");
    div.className = "line";
    div.innerHTML = html;
    // insert before the active input line if present
    if (inputLine && inputLine.parentNode === screen) screen.insertBefore(div, inputLine);
    else screen.appendChild(div);
    scrollDown();
    return div;
  }
  function outText(t) {
    if (CAPTURE) { CAPTURE.push(t == null ? "" : String(t)); return; }
    out(esc(t == null ? "" : t));
  }
  function outLines(arr) { for (const l of arr) outText(l); }

  // ======================================================================
  //  fastfetch
  // ======================================================================
  function upSince() {
    const secs = Math.floor((Date.now() - BOOT_TS) / 1000) + 41 * 60; // seed a plausible uptime
    const d = Math.floor(secs / 86400);
    const h = Math.floor((secs % 86400) / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const parts = [];
    if (d) parts.push(d + " day" + (d > 1 ? "s" : ""));
    if (h) parts.push(h + " hour" + (h > 1 ? "s" : ""));
    parts.push(m + " min" + (m !== 1 ? "s" : ""));
    return parts.join(", ");
  }

  function renderLogo() {
    // Replace $1/$2 color slots. Both map to cyan (Arch blue); rendered identically
    // to match fastfetch's default builtin color table for "arch".
    let lines = ARCH_LOGO.split("\n").map((l) => esc(l));
    // strip the $1/$2 markers (they only matter when the two slots differ)
    return lines.map((l) => l.replace(/\$[12]/g, "")).join("\n");
  }

  function packageCount() {
    return 913 + (typeof INSTALLED === "object" ? Object.keys(INSTALLED).filter((k) => k !== "noctalia-shell").length : 0);
  }

  function fastfetch() {
    const info = [
      ["title", USER + "@" + HOST],
      ["rule", ""],
      ["OS", "Arch Linux x86_64"],
      ["Host", "B550 AORUS ELITE V2"],
      ["Kernel", "Linux " + KVER],
      ["Uptime", upSince()],
      ["Packages", packageCount() + " (pacman)"],
      ["Shell", "bash 5.2.26"],
      ["Display", "1920x1080 @ 165 Hz (as 1536x864)"],
      ["WM", "Hyprland (Wayland)"],
      ["Theme", "Adwaita-dark [GTK2/3]"],
      ["Icons", "Papirus-Dark [GTK2/3]"],
      ["Terminal", "foot 1.18.1"],
      ["CPU", "AMD Ryzen 7 5800X (16) @ 4.85 GHz"],
      ["GPU", "AMD Radeon RX 6700 XT"],
      ["Memory", "3.21 GiB / 15.55 GiB (21%)"],
      ["Swap", "0 B / 8.00 GiB (0%)"],
      ["Disk (/)", "38.4 GiB / 476.44 GiB (8%) - ext4"],
      ["Local IP", "192.168.1.42/24 (enp5s0)"],
      ["Locale", "en_US.UTF-8"],
    ];
    const title = USER + "@" + HOST;
    const infoHtml = info
      .map(([k, v]) => {
        if (k === "title") return '<span class="ff-title">' + esc(v) + "</span>";
        if (k === "rule") return '<span class="ff-sep">' + "-".repeat(title.length) + "</span>";
        return '<span class="ff-key">' + esc(k) + '</span><span class="ff-sep">: </span>' + esc(v);
      })
      .join("\n");

    // two rows of color blocks like real fastfetch
    let row1 = "", row2 = "";
    for (let i = 0; i < 8; i++) row1 += '<span class="blk" style="background:var(--c' + i + ')"></span>';
    for (let i = 8; i < 16; i++) row2 += '<span class="blk" style="background:var(--c' + i + ')"></span>';

    const html =
      '<div class="ff">' +
      '<div class="ff-logo">' + renderLogo() + "</div>" +
      '<div class="ff-info">' + infoHtml +
      '\n<div class="ff-blocks">' + row1 + "</div>" +
      '<div class="ff-blocks">' + row2 + "</div>" +
      "</div></div>";
    out(html);
  }

  // ======================================================================
  //  Commands
  // ======================================================================
  const HISTORY = ["fastfetch", "pacman -Syu", "ls"];
  let histIdx = HISTORY.length;

  function classify(name, node) {
    if (node.type === "dir") return "dir";
    if (node.html || name.endsWith(".html") || name.endsWith(".htm")) return "html";
    if (name.endsWith(".sh") || node.exe) return "exe";
    return "";
  }
  function colorName(name, node) {
    const c = classify(name, node);
    const label = node.type === "dir" ? esc(name) : esc(name);
    return c ? '<span class="' + c + '">' + label + "</span>" : esc(name);
  }

  const commands = {
    help() {
      out('<span class="arch-b">Arch Linux WebTTY</span> — a real shell. Your changes persist across reloads.');
      const groups = [
        ["system", "fastfetch neofetch uname hostname uptime free df lsblk lscpu whoami id date env printenv"],
        ["packages", "pacman -Syu · pacman -S <pkg> · pacman -Q · pacman -Ss <q>"],
        ["★ noctalia", "sudo pacman -S noctalia-shell   then:  noctalia   (launch the real desktop shell)"],
        ["git", "git init/clone/add/commit/status/log/branch/checkout/config"],
        ["build & run", "gcc -Wall -c -o -v · ./out · make · node file.js · node -e '…' · bash script.sh"],
        ["files", "ls cd cd- pwd cat mkdir touch rm mv cp tree head tail grep wc sort cut find stat chmod du"],
